<title>You Are a Cat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Layout: Carolina's crayon-blue dotted frame holds a tap-to-play stage; the story sits below in blue-pen capitals like her note */
:root{
  --sky:#2c8fd6; --sky-dot:#7cc6f0; --sky-soft:#d7ecfa; --paper:#fffaf6; --ink:#1d1a1f;
  --pen:#1f5fa8; --pink:#f3a3c6; --hot:#e0508a; --gold:#d6ad45;
  --display:"Gochi Hand","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
}
html,body{background:var(--sky-soft);color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0;line-height:1;color:var(--hot);text-wrap:balance}
.by{font-size:1rem;color:var(--pen);margin-top:2px}
.hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:1.05rem;display:flex;align-items:center;gap:5px;color:var(--ink);font-family:var(--body);line-height:1.4;font-variant-numeric:tabular-nums}
button.chip{cursor:pointer}
button.chip:focus-visible{outline:3px dashed var(--hot);outline-offset:2px}
.frame{background:var(--sky);background-image:radial-gradient(circle,var(--sky-dot) 0 5px,transparent 6px);background-size:56px 56px;padding:8px;border-radius:6px;border:2.5px solid var(--ink)}
#stage{display:block;width:100%;height:auto;background:var(--paper);border-radius:14px;border:2.5px solid var(--ink);touch-action:manipulation;transition:opacity .3s;-webkit-tap-highlight-color:transparent;user-select:none}
#stage.fade{opacity:0}
.story{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;color:var(--pen);min-height:4.4em}
#story{font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.35;margin:0}
#hint{font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--hot);margin:6px 0 0}

/* svg bits */
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible{outline:3px dashed var(--hot)}
.lbl{font-family:var(--display);font-size:17px;fill:var(--pen);stroke:#fff;stroke-width:4px;paint-order:stroke;letter-spacing:.04em}
.say{font-family:var(--display);font-size:27px;letter-spacing:.03em}
.sign{font-family:var(--display);font-size:26px;fill:var(--pen)}
#catAnim,#palAnim{transform-box:fill-box;transform-origin:50% 100%}
.walk{animation:walk .32s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(-3deg)}75%{transform:translateY(-5px) rotate(3deg)}}
.jump{animation:jump .7s ease-out}
@keyframes jump{0%{transform:none}30%{transform:translateY(-70px) scale(.9,1.12)}60%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
.wiggle{animation:wiggle .9s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.stretch{animation:stretch .9s ease-in-out}
@keyframes stretch{0%,100%{transform:none}40%{transform:scale(1.15,.85)}70%{transform:scale(.92,1.12)}}
.breathe{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05,1)}}
.zzz text{font-family:var(--display);fill:var(--sky);font-size:30px;animation:zz 2.4s ease-out infinite;transform-box:fill-box}
.zzz text:nth-child(2){animation-delay:.6s;font-size:24px}
.zzz text:nth-child(3){animation-delay:1.2s;font-size:20px}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(12px,-22px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
.floaty{animation:floaty 1.5s ease-out both;transform-box:fill-box}
@keyframes floaty{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-80px);opacity:0}}
.bubble{animation:pop .25s ease-out;transform-box:fill-box;transform-origin:center bottom}
@keyframes pop{0%{transform:scale(.3)}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .9s linear;transform-box:fill-box}
@keyframes shake{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:translate(-3px,1px)}20%,40%,60%,80%{transform:translate(3px,-1px)}}
.drive{animation:drive 2.2s ease-in-out}
@keyframes drive{0%{transform:translateX(0)}40%{transform:translateX(200px)}41%{transform:translateX(-420px)}100%{transform:translateX(0)}}
.flap{animation:flap .35s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flap{50%{transform:scaleX(.35)}}
.bfly{transition:transform 1s ease-in-out}
.dot{transition:transform .35s cubic-bezier(.5,0,.2,1),opacity .3s}
.dot.gone{opacity:0;pointer-events:none}
.jit{animation:jit .5s steps(2) infinite}
@keyframes jit{50%{transform:translate(1.5px,-1px)}}
.rainfall{animation:fall .9s linear infinite}
@keyframes fall{to{transform:translateY(520px)}}
.ripple{animation:ripple 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.2);opacity:0}}
/* a new sticker pops up big, waits a moment, then fades away */
.stkpop{animation:stkpop 2.3s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes stkpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}15%{transform:scale(1.15) rotate(4deg);opacity:1}25%{transform:scale(1) rotate(0)}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30px)}}
/* the shy grey cat ducks behind the wall */
.duck{animation:duck 1.5s ease-in-out}
/* the cup wobbles from its bottom when the cat pushes it */
.cupw{transform-box:fill-box;transform-origin:50% 100%}
@keyframes duck{0%,100%{transform:none}25%,70%{transform:translateY(75px)}}
@media (prefers-reduced-motion:reduce){
  .walk,.pulse,.breathe,.flap,.zzz text,.jit,.rainfall,.ripple{animation:none}
  .jump,.wiggle,.stretch,.shake,.drive,.stkpop,.duck{animation-duration:.01s}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>You Are a Cat</h1>
      <div class="by">A game by Carolina</div>
    </div>
    <div class="hud">
      <span class="chip" aria-label="Hearts"><svg width="18" height="18" viewBox="-14 -14 28 24" aria-hidden="true"><path d="M0,8 C-10,0 -14,-7 -7,-11 C-3,-13 0,-10 0,-7 C0,-10 3,-13 7,-11 C14,-7 10,0 0,8Z" fill="#e0508a" stroke="#1d1a1f" stroke-width="2"/></svg><span id="hearts">0</span></span>
      <span class="chip" id="tummyChip" aria-label="Tummy">TUMMY <span id="tummy"></span></span>
      <button class="chip" id="snd" type="button" aria-pressed="true">♪ ON</button>
    </div>
  </header>

  <div class="frame">
    <svg id="stage" viewBox="0 0 400 520" role="group" aria-label="The cat game"></svg>
  </div>

  <div class="story" aria-live="polite">
    <p id="story">You are a cat. You are asleep.</p>
    <p id="hint">Tap the cat to wake up!</p>
  </div>
</div>

<script>
const INK='#1d1a1f';
const K=`stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const HEART="M0,8 C-10,0 -14,-7 -7,-11 C-3,-13 0,-10 0,-7 C0,-10 3,-13 7,-11 C14,-7 10,0 0,8Z";
const BODY="M-19,-80 L-21,-8 Q-21,2 -12,2 Q-3,2 -3,-8 L-2,-18 L3,-18 L4,-7 Q4,2 13,2 Q21,2 21,-8 L18,-80 Z";
const FLOOR=450;
const stage=document.getElementById('stage');
const $=s=>stage.querySelector(s);
let uid=0, moodT=null;

const S={scene:'bed',awake:false,tummy:0,hearts:0,x:200,face:1,mood:'sleep',fridge:false,bowl:0,fly:{x:300,y:200},busy:false,sound:true,fish:false,
  day:1,rain:false,umbrella:false,dot:{x:300,y:478,n:0,hid:false},stars:[],wink:false,
  earned:0,stk:[],newStk:[],pal:false,palX:136,palFace:1,
  box:'door',cup:0};
const FISH=5, UMB=2;
const STARS=[[60,84],[150,48],[222,146],[96,206],[364,214]];
const WORDS=['One','Two','Three','Four','Five'];
// the cup slides along the kitchen counter, one push at a time; the counter ends at x=304
const CUPX=[290,297,303];
// every time the total of hearts ever earned reaches one of these, a new sticker unlocks
const STK_AT=[3,6,10,15,21,28,36,45];
// the big fridge door in the sticker scene, and the small closed fridge in the kitchen
const DOOR={x:115,y:14,w:170,h:433}, FRIDGE={x:22,y:170,w:110,h:280};
const PINK={head:'#a8652f',body:'#f3a3c6',ear:'#f1e05a'}, GREY={head:'#8d8d9a',body:'#d3d4dc',ear:'#f3a3c6'};
let T=[];
function later(fn,ms){T.push(setTimeout(fn,ms))}
function clearLater(){T.forEach(clearTimeout);T=[];clearTimeout(moodT)}
const homeward=()=>S.tummy>=3&&S.fish==='eaten';
const night=homeward;
const umbOn=()=>S.scene==='city'&&S.rain&&S.umbrella;
// speech bubbles sit above the cat's head, or above its box hat or umbrella
const headY=()=>FLOOR-(umbOn()?268:S.box==='hat'?226:190);
const fridgeShut=()=>!S.fridge||(S.tummy>=3&&S.bowl===0);

/* stickers and the friend cat are kept between visits on this device */
const SAVE='you-are-a-cat';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({earned:S.earned,stk:S.stk,newStk:S.newStk,pal:S.pal}))}catch(e){}}
try{
  const v=JSON.parse(localStorage.getItem(SAVE)||'null');
  if(v&&Array.isArray(v.stk)&&Array.isArray(v.newStk)){S.earned=+v.earned||0;S.stk=v.stk;S.newStk=v.newStk;S.pal=!!v.pal}
}catch(e){}

/* ---------- drawing helpers ---------- */
function cloud(cx,cy,rx,ry,n){
  let d='';
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2, x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    if(i===0){d+=`M${x.toFixed(1)},${y.toFixed(1)}`}
    else{const m=(i-.5)/n*Math.PI*2;d+=`Q${(cx+rx*1.3*Math.cos(m)).toFixed(1)},${(cy+ry*1.3*Math.sin(m)).toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`}
  }
  return d+'Z';
}
function heart(x,y,s,fill){return `<path transform="translate(${x},${y}) scale(${s})" d="${HEART}" fill="${fill}" stroke="${INK}" stroke-width="${(2/s).toFixed(2)}"/>`}

function catSVG(m,carry,umb,p=PINK,hat=false){
  const ra=umb?'40,-102':m==='push'?'46,-124':'45,-61';
  let st='';for(let y=-74;y<=-6;y+=8) st+=`M-22,${y} q5.25,-5 10.5,0 t10.5,0 t10.5,0 t10.5,0 `;
  let eyes;
  if(m==='sleep') eyes=`<path d="M-15,-104 q5,5 10,0 M5,-104 q5,5 10,0" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
  else if(m==='happy') eyes=`<path d="M-15,-102 q5,-7 10,0 M5,-102 q5,-7 10,0" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
  else if(m==='scared') eyes=`<circle cx="-10" cy="-105" r="6.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="10" cy="-105" r="6.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="-10" cy="-105" r="2.3" fill="${INK}"/><circle cx="10" cy="-105" r="2.3" fill="${INK}"/>`;
  else eyes=`<circle cx="-10" cy="-104" r="3.3" fill="${INK}"/><circle cx="10" cy="-104" r="3.3" fill="${INK}"/><circle cx="-9" cy="-105.2" r="1" fill="#fff"/><circle cx="11" cy="-105.2" r="1" fill="#fff"/>`;
  const mouth=m==='scared'
    ?`<ellipse cx="0" cy="-89" rx="3.5" ry="4.5" fill="${INK}"/>`
    :`<path d="M-5,-92 q2.5,3 5,0 q2.5,3 5,0" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`;
  return `
  ${umb?`<path d="M40,-100 V-176" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M-8,-176 Q40,-232 88,-176 q-8,-8 -16,0 q-8,-8 -16,0 q-8,-8 -16,0 q-8,-8 -16,0 q-8,-8 -16,0 q-8,-8 -16,0Z" fill="#2c8fd6" ${K}/>
  <path d="M40,-212 Q30,-196 24,-178 M40,-212 Q50,-196 56,-178" fill="none" stroke="#fffaf6" stroke-width="2.5" stroke-linecap="round"/>`:''}
  <path d="M-18,-68 L-46,-58 M17,-68 L${ra}" stroke="${INK}" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M-18,-68 L-46,-58 M17,-68 L${ra}" stroke="${p.head}" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M-46,-58 l-6,-5 M-46,-58 l-7,1 M-46,-58 l-4,6 M${ra} l6,-5 M${ra} l7,1 M${ra} l4,6" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>
  <path d="${BODY}" fill="${p.body}"/>
  <path d="${st}" fill="none" stroke="${INK}" stroke-width="2" clip-path="url(#catClip)"/>
  <path d="${BODY}" fill="none" ${K}/>
  <path d="M-28,-88 L-29,-124 L-24,-142 L-9,-125 L13,-127 L28,-148 L31,-116 L30,-88 Q30,-79 21,-79 L-19,-79 Q-28,-79 -28,-88Z" fill="${p.head}" ${K}/>
  <path d="M-24,-134 L-14,-126 L-25,-124Z M25,-139 L18,-128 L27,-125Z" fill="${p.ear}" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M-9,-115 l4,3 M-4,-117 l4,3 M-6,-120 l3,3" stroke="#e0508a" stroke-width="2" stroke-linecap="round"/>
  ${eyes}
  <path d="M-3,-98 L3,-98 L0,-95Z" fill="#e0508a" stroke="${INK}" stroke-width="1.2"/>
  ${mouth}
  <path d="M-12,-95 L-40,-99 M-12,-92 L-40,-88 M12,-95 L40,-99 M12,-92 L40,-88" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>
  ${carry?`<path d="M-6,-88 q14,-12 28,0 q-14,12 -28,0Z M22,-88 l11,-8 v16Z" fill="#f9a03f" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-90" r="1.8" fill="${INK}"/>`:''}
  ${hat?`<g transform="rotate(-6 0 -140)"><rect x="-31" y="-172" width="62" height="46" fill="#d9a066" ${K}/>
  <path d="M-31,-126 L-42,-118 M31,-126 L42,-118" ${K}/><rect x="-4" y="-171" width="9" height="44" fill="#f1e05a" opacity=".85"/>
  ${heart(-16,-150,.6,'#e0508a')}</g>`:''}`;
}

function arrow(side,label){
  const x=side==='left'?40:360;
  const d=side==='left'
    ?`M${x+11},52 H${x-11} M${x-2},42 L${x-12},52 L${x-2},62`
    :`M${x-11},52 H${x+11} M${x+2},42 L${x+12},52 L${x+2},62`;
  return `<circle cx="${x}" cy="52" r="25" fill="#fffaf6" ${K}/><path d="${d}" fill="none" stroke="#2c8fd6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="${side==='left'?14:386}" y="98" text-anchor="${side==='left'?'start':'end'}" class="lbl">${label}</text>`;
}

const DEFS=`<defs>
<filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
<clipPath id="catClip"><path d="${BODY}"/></clipPath>
<clipPath id="wallClip"><rect x="200" y="0" width="200" height="337"/></clipPath>
<pattern id="hearts" width="48" height="48" patternUnits="userSpaceOnUse"><path transform="translate(12,14) scale(.55)" d="${HEART}" fill="#f6b3cb"/><path transform="translate(36,38) scale(.55)" d="${HEART}" fill="#f6b3cb"/></pattern>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="3" fill="#f3c98a"/><circle cx="30" cy="30" r="3" fill="#9fd0ef"/></pattern>
<pattern id="tiles" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#fff"/><rect width="18" height="18" fill="#f7b9d0"/><rect x="18" y="18" width="18" height="18" fill="#f7b9d0"/></pattern>
</defs>`;

/* ---------- things in scenes ---------- */
/* the delivery box at the front door; while the cat is inside, its head pokes out between the flaps */
function deliveryBox(){
  const inside=S.box==='in';
  return `<rect x="306" y="366" width="90" height="90" fill="transparent"/>
  ${inside?`<path d="M326,402 L334,390 H392 L386,402Z" fill="#8a5a2b" ${K}/><g transform="translate(355,454) scale(.55)">${catSVG('happy')}</g>`:''}
  <rect x="322" y="402" width="64" height="48" fill="#d9a066" ${K}/>
  ${inside?`<path d="M322,402 L306,382 L338,386 L348,402Z M386,402 L398,378 L366,384 L360,402Z" fill="#e8b47a" ${K}/>`
    :`<path d="M322,402 L332,390 H394 L386,402Z" fill="#e8b47a" ${K}/><path d="M355,401 L362,391" stroke="#f1e05a" stroke-width="8" opacity=".85"/>`}
  <rect x="350" y="404" width="9" height="44" fill="#f1e05a" opacity=".85"/>
  ${heart(337,428,.7,'#e0508a')}
  <path d="M372,440 V418 M365,425 L372,417 L379,425" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
}
/* the cup on the kitchen counter, drawn with its bottom at 0,0 */
const cupArt=()=>`<g transform="scale(1.35)"><path d="M-11,-25 H11 L9,-3 Q9,0 6,0 H-6 Q-9,0 -9,-3Z" fill="#fff" ${K} stroke-width="2.5"/>
  <path d="M10,-20 q10,-1 9,8 q-1,6 -10,5" fill="none" stroke="${INK}" stroke-width="2.5"/>${heart(0,-12,.55,'#e0508a')}</g>`;
function cupHot(){
  const x=CUPX[S.cup];
  return `<rect x="${x-28}" y="268" width="56" height="62" fill="transparent"/><g transform="translate(${x},322) rotate(${S.cup===2?9:0})"><g class="cupw">${cupArt()}</g></g>`;
}
function shards(){
  return `<g transform="translate(325,495) scale(1.4) translate(-325,-495)"><path d="M296,496 l9,-11 l6,10Z M318,500 l4,-13 l9,9Z M338,492 l10,-6 l2,10Z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
  <path d="M352,500 q9,-1 8,-9" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M322,494 l2,-4 l3,4Z" fill="#e0508a"/></g>`;
}
function bunnyBox(){
  return `<rect x="186" y="232" width="128" height="9" fill="#a8652f" ${K}/>
  <path d="M212,200 Q212,232 250,232 Q288,232 288,200 Z" fill="#e5558e" ${K}/>
  <circle cx="232" cy="216" r="7" fill="none" stroke="#fbd0e0" stroke-width="3"/><circle cx="268" cy="216" r="7" fill="none" stroke="#fbd0e0" stroke-width="3"/>
  <rect x="208" y="190" width="84" height="12" rx="5" fill="#f7b6cf" ${K}/>
  <ellipse cx="250" cy="189" rx="38" ry="8" fill="#ee6aa0" ${K}/>
  ${heart(228,189,.45,'#d9363e')}${heart(273,189,.45,'#d9363e')}
  <ellipse cx="243" cy="132" rx="4.5" ry="12" fill="#d6ad45" ${K} stroke-width="2"/><ellipse cx="257" cy="132" rx="4.5" ry="12" fill="#d6ad45" ${K} stroke-width="2"/>
  <ellipse cx="243" cy="132" rx="1.8" ry="7" fill="#c23a68"/><ellipse cx="257" cy="132" rx="1.8" ry="7" fill="#c23a68"/>
  <ellipse cx="250" cy="170" rx="13" ry="16" fill="#d6ad45" ${K} stroke-width="2.5"/>
  <circle cx="250" cy="149" r="12" fill="#d6ad45" ${K} stroke-width="2.5"/>
  <circle cx="245" cy="147" r="2" fill="${INK}"/><circle cx="255" cy="147" r="2" fill="${INK}"/>
  <path d="M248,152 L252,152 L250,155Z" fill="#d9363e"/>
  ${heart(250,169,.55,'#d9363e')}`;
}
function picture(){
  return `<rect x="46" y="118" width="104" height="122" rx="3" fill="#2c8fd6" ${K}/>
  <rect x="58" y="130" width="80" height="98" fill="#bfe0f5" stroke="${INK}" stroke-width="2"/>
  <path d="${cloud(98,180,26,34,9)}" fill="#fff" stroke="${INK}" stroke-width="2"/>
  <g transform="translate(98,212) scale(.4)">${catSVG('normal')}</g>
  <circle cx="52" cy="124" r="3" fill="#7cc6f0"/><circle cx="144" cy="124" r="3" fill="#7cc6f0"/><circle cx="52" cy="234" r="3" fill="#7cc6f0"/><circle cx="144" cy="234" r="3" fill="#7cc6f0"/>`;
}
function sofa(){
  return `<rect x="120" y="330" width="160" height="64" rx="18" fill="#e5558e" ${K}/>

/* ---------- render ---------- */
function catLayer(){
  if(SC[S.scene].noCat||S.box==='in') return '';
  if(S.scene==='bed'&&!S.awake){
    return `${S.pal?`<g pointer-events="none" transform="translate(306,432) rotate(-84) scale(.62)"><g class="breathe" style="transform-box:fill-box;transform-origin:50% 100%">${catSVG('sleep',false,false,GREY)}</g></g>`:''}
      <g class="hot${SC.bed.goal().id==='cat'?' pulse':''}" data-id="cat" role="button" tabindex="0" aria-label="Sleeping cat">
      <g transform="translate(272,396) rotate(-84)"><g id="catAnim" class="breathe">${catSVG('sleep')}</g></g></g>
      <g class="zzz" pointer-events="none"><text x="120" y="318">Z</text><text x="146" y="296">z</text><text x="166" y="278">z</text></g>`;
  }
  const pet=S.scene==='bed'?'class="hot" data-id="cat" role="button" tabindex="0" aria-label="Pet the cat"':'pointer-events="none"';
  return `<g id="cat" ${pet} transform="translate(${S.x},${FLOOR})"><g id="catFlip" transform="scale(${S.face},1)"><g id="catAnim">${catArt(S.mood)}</g></g></g>`;
}
const catArt=m=>catSVG(m,S.fish==='carry',umbOn(),PINK,S.box==='hat');
// the friend walks behind the cat; it sits under the other hotspots so it never blocks them, and can be tapped for a cuddle
function palLayer(){
  if(!S.pal||SC[S.scene].noCat||(S.scene==='bed'&&!S.awake)) return '';
  return `<g class="hot" data-id="pal" role="button" tabindex="0" aria-label="Your grey cat friend"><g id="pal" transform="translate(${S.palX.toFixed(1)},${FLOOR}) scale(.82)"><g id="palFlip" transform="scale(${S.palFace},1)"><g id="palAnim">${catSVG('normal',false,false,GREY)}</g></g></g></g>`;
}
let HOTS={};
function render(){
  const sc=SC[S.scene], p=sc.goal().id, hs=sc.hots();
  HOTS={};hs.forEach(h=>HOTS[h.id]=h);
  if(S.scene==='bed') HOTS.cat={id:'cat',tap:S.awake?pet:wake};
  if(S.pal) HOTS.pal={id:'pal',tap:petPal};
  const ae=document.activeElement, fid=stage.contains(ae)&&ae.dataset?ae.dataset.id:null;
  stage.innerHTML=DEFS+`<g filter="url(#wob)">${sc.draw()}</g>`+palLayer()+
    hs.map(h=>`<g class="hot${p===h.id?' pulse':''}" data-id="${h.id}" role="button" tabindex="0" aria-label="${h.label}">${h.svg}</g>`).join('')+
    catLayer()+(sc.over?sc.over():'');
  const f=fid&&$(`[data-id="${fid}"]`);f&&f.focus();
}
function refreshGoal(){const id=SC[S.scene].goal().id;stage.querySelectorAll('.hot').forEach(el=>el.classList.toggle('pulse',el.dataset.id===id&&el.id!=='cat'))}
function redraw(){render()}

/* ---------- cat actions ---------- */
function setMood(m){S.mood=m;const a=$('#catAnim');if(a&&!(S.scene==='bed'&&!S.awake))a.innerHTML=catArt(m)}
function restartClass(el,cls,ms){el.classList.remove(cls);el.getBoundingClientRect();el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
function walkTo(tx,cb){
  const dist=tx-S.x;
  if(Math.abs(dist)<4){cb&&cb();return}
  S.busy=true;S.face=dist<0?-1:1;
  const flip=$('#catFlip'),an=$('#catAnim'),cat=$('#cat');
  if(!cat){S.busy=false;cb&&cb();return}
  flip.setAttribute('transform',`scale(${S.face},1)`);an.classList.add('walk');
  const sx=S.x,dur=Math.abs(dist)/.22,t0=performance.now();
  (function step(t){
    const p=Math.min(1,(t-t0)/dur);S.x=sx+dist*p;cat.setAttribute('transform',`translate(${S.x},${FLOOR})`);follow();
    if(p<1)requestAnimationFrame(step);else{an.classList.remove('walk');S.busy=false;cb&&cb()}
  })(t0);
}
function leave(tx,cb){walkTo(tx,cb)}
let palRaf=0;
function follow(){
  if(palRaf||!S.pal)return;
  const tick=()=>{
    const el=$('#pal'),fl=$('#palFlip'),an=$('#palAnim');
    if(!el){palRaf=0;return}
    const tx=Math.max(30,Math.min(370,S.x-62*S.face)),d=tx-S.palX;
    if(Math.abs(d)<1.5){
      palRaf=0;an.classList.remove('walk');S.palFace=S.x>=S.palX?1:-1;fl.setAttribute('transform',`scale(${S.palFace},1)`);return;
    }
    S.palX+=Math.sign(d)*Math.min(Math.abs(d)*.12+.4,4.2);S.palFace=Math.sign(d);
    el.setAttribute('transform',`translate(${S.palX.toFixed(1)},${FLOOR}) scale(.82)`);fl.setAttribute('transform',`scale(${S.palFace},1)`);an.classList.add('walk');
    palRaf=requestAnimationFrame(tick);
  };
  palRaf=requestAnimationFrame(tick);
}
// from: 'left' or 'right' walks in from that edge; a number puts the cat right there (top or bottom of a ladder)
function go(name,from){
  clearLater();S.busy=true;stage.classList.add('fade');
  setTimeout(()=>{
    const at=typeof from==='number';
    S.scene=name;S.x=at?from:from==='left'?-50:450;S.face=1;S.mood='normal';
    S.palX=at?Math.max(30,from-62):from==='left'?-120:520;
    SC[name].before&&SC[name].before();render();updateHud();
    stage.classList.remove('fade');SC[name].enter();
    if(at){const an=$('#catAnim');an&&restartClass(an,'stretch',900);S.busy=false}
    else walkTo(from==='left'?80:320,()=>{});
    follow();
  },300);
}
function react(kind,earn=true){
  clearTimeout(moodT);
  const an=$('#catAnim');
  const by=headY();
  if(kind==='scared'){setMood('scared');an&&restartClass(an,'jump',700);bubble(S.x,by,'MIAAWOW!','#d9363e');sfx.meow(true)}
  else{setMood('happy');an&&restartClass(an,'wiggle',900);bubble(S.x,by,'POOOOURRR','#e0508a');sfx.purr();if(earn){hearts(S.x,FLOOR-150);earnHeart()}}
  moodT=setTimeout(()=>setMood('normal'),1600);
}
function earnHeart(){
  S.hearts++;S.earned++;updateHud();
  const i=STK_AT.indexOf(S.earned);
  if(i<0){save();return}
  S.newStk.push(i);save();
  // after the caller has told its own story, add the news and show the sticker big
  setTimeout(()=>{document.getElementById('story').textContent+=' New sticker!';refreshGoal()},0);
  setTimeout(()=>{stickerPop(i);sfx.sticker()},700);
}
function stickIt(){
  if(!S.newStk.length){say('Your fridge door. Tap a sticker!');return}
  const i=S.newStk.shift(),p=TAP||{x:DOOR.x+30+Math.random()*(DOOR.w-60),y:DOOR.y+40+Math.random()*(DOOR.h-80)};
  S.stk.push({i,x:Math.round(Math.max(DOOR.x+28,Math.min(DOOR.x+DOOR.w-28,p.x))),y:Math.round(Math.max(DOOR.y+28,Math.min(DOOR.y+DOOR.h-28,p.y))),r:Math.round(Math.random()*28-14)});
  save();sfx.stick();render();
  const el=$('.stk'+(S.stk.length-1));el&&restartClass(el,'stretch',900);
  say(`Stick! You put ${STK[i].name} on the fridge.`+(S.newStk.length?' One more!':''));
}
function admire(n){
  const s=S.stk[n],el=$('.stk'+n);el&&restartClass(el,'wiggle',900);sfx.twinkle(1+n%5);
  bubble(s.x,Math.max(70,s.y-60),STK[s.i].name.replace('a ','').toUpperCase()+'!','#e0508a');
  say(`A sticker of ${STK[s.i].name}!`);
}
function meetFriend(){
  S.face=1;$('#catFlip').setAttribute('transform','scale(1,1)');
  if(S.fish==='carry'){
    // sharing the fish makes a friend; it hops off the wall and follows you home
    S.pal=true;S.palX=272;S.palFace=-1;save();render();
    const an=$('#palAnim');an&&restartClass(an,'jump',700);
    sfx.meow(false);bubble(272,230,'MEOW!','#8d8d9a');
    later(()=>{react('happy');follow()},700);
    say('You share your fish with the grey cat. Now it is your friend!');
  }else{
    const w=$('.palWall');w&&restartClass(w,'duck',1500);
    say('The grey cat is shy. It hides! Maybe it likes fish?');
  }
}
function petPal(){
  const an=$('#palAnim');an&&restartClass(an,'wiggle',900);
  react('happy');say('You cuddle your friend. Poooourrr!');
}
function wake(){
  S.awake=true;S.busy=true;S.x=200;S.face=1;S.mood='normal';S.palX=136;S.palFace=1;render();updateHud();
  const an=$('#catAnim');an&&restartClass(an,'stretch',900);
  setTimeout(()=>S.busy=false,900);
  sfx.rumble();later(()=>bubble(S.x,FLOOR-190,'RUMBLE!','#a8652f'),250);
  say(S.rain?'You wake up. It is raining! And you are hungry…':'You wake up and you are hungry! Rumble rumble…');
}
function pounce(){
  const d=S.dot,an=$('#catAnim'),el=$('.dot');if(d.hid||!el)return;
  an&&restartClass(an,'jump',700);sfx.pounce();d.n++;
  if(d.n>=3){
    // third pounce: the dot zips under the sofa and comes back a bit later
    d.x=200;d.y=440;d.hid=true;el.style.transform=`translate(${d.x}px,${d.y}px)`;el.classList.add('gone');
    later(()=>react('happy'),650);say('Pounce! Zip… the dot hides under the sofa!','Tap the sofa to look');
    later(()=>{d.hid=false;d.n=0;d.x=90+Math.random()*200;d.y=470;el.style.transform=`translate(${d.x}px,${d.y}px)`;el.classList.remove('gone');say('The red dot is back!','Catch the red dot!')},5000);
  }else{
    d.x=d.x>200?60+Math.random()*110:230+Math.random()*100;d.y=[470,492,300,260][Math.floor(Math.random()*4)];
    el.style.transform=`translate(${d.x}px,${d.y}px)`;
    later(()=>react('happy'),650);say('Pounce! The dot zips away. Catch it again!');
  }
}
function countStar(i){
  if(S.stars.includes(i)){const [x,y]=STARS[i];bubble(x,y+60,`${WORDS[S.stars.indexOf(i)]}!`,'#d6ad45');return}
  S.stars.push(i);const n=S.stars.length,[x,y]=STARS[i];
  sfx.twinkle(n);redraw();bubble(x,y+62,`${WORDS[n-1]}!`,'#d6ad45');
  if(n<STARS.length){clearTimeout(moodT);setMood('happy');moodT=setTimeout(()=>setMood('normal'),1200);say(`${WORDS[n-1]} star${n>1?'s':''}!`)}
  else{react('happy');say('Five stars! You counted them all. Poooourrr!')}
}
function meowMoon(){
  S.busy=true;S.face=1;$('#catFlip').setAttribute('transform','scale(1,1)');
  sfx.meow(false);bubble(S.x,headY(),'MEOW!','#2c8fd6');say('You meow at the moon…','');
  later(()=>{
    const o=$('.eyeOpen'),c=$('.eyeShut');o&&(o.style.display='none');c&&(c.style.display='');
    sfx.twinkle(5);bubble(300,192,'WINK!','#d6ad45');S.wink=true;S.busy=false;react('happy');
    say('The moon winks back at you! Poooourrr!');
    later(()=>{o&&(o.style.display='');c&&(c.style.display='none')},1300);
  },900);
}
function hopInBox(){
  // jump in, peek out, then pop up wearing the box as a hat until bedtime
  S.busy=true;S.face=1;$('#catFlip').setAttribute('transform','scale(1,1)');
  const an=$('#catAnim');an&&restartClass(an,'jump',700);sfx.boing();
  say('A box! You jump in…','');
  later(()=>{S.box='in';render();bubble(354,316,'IT FITS!','#a8652f')},450);
  later(()=>{S.box='hat';S.x=354;S.busy=false;render();sfx.boing();react('happy');say('Pop! Now the box is your hat!')},2000);
}
function pushCup(){
  S.face=1;$('#catFlip').setAttribute('transform','scale(1,1)');
  if(S.cup>=2){fallCup();return}
  S.cup++;clearTimeout(moodT);S.mood='push';render();sfx.scrape();
  const c=$('.cupw');c&&restartClass(c,'wiggle',900);
  moodT=setTimeout(()=>setMood('normal'),700);
  say(S.cup===1?'You push the cup with your paw. Slowly…':'Slowly… slowly… It is on the edge!');
}
function fallCup(){
  S.busy=true;S.cup='fall';clearTimeout(moodT);S.mood='push';render();sfx.scrape();say('One more push…','');
  const id='c'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none" transform="translate(303,322) rotate(9)">${cupArt()}</g>`);
  const g=document.getElementById(id);
  later(()=>{
    const t0=performance.now();
    (function step(t){
      const p=Math.max(0,Math.min(1,(t-t0)/600));
      g.setAttribute('transform',`translate(${303+22*p},${322+170*p*p}) rotate(${9+120*p})`);
      if(p<1)requestAnimationFrame(step);else crash();
    })(t0);
  },500);
}
function crash(){
  S.cup='broken';S.mood='normal';render();sfx.crash();
  restartClass(document.querySelector('.frame'),'shake',900);
  bubble(308,170,'CRASH!','#d9363e');
  const pa=$('#palAnim');pa&&restartClass(pa,'jump',700);
  later(()=>react('scared'),250);
  say('CRASH! The cup breaks. Oops! Miaawow!','');
  later(()=>{S.busy=false;react('happy');say('Oops… that was so funny! Poooourrr!')},1800);
}
function pet(){react('happy');say('You lick your paws. Poooourrr!')}
function hungry(){
  sfx.rumble();bubble(S.x,headY(),'RUMBLE!','#a8652f');
  say('Tummy rumble! Milk first.');
}
function nap(){
  walkTo(200,()=>{
    S.awake=false;S.tummy=0;S.fridge=false;S.bowl=0;S.fish=false;S.mood='sleep';S.stars=[];S.wink=false;S.box='door';S.cup=0;
    // a new day: the second one is always rainy so everyone gets to see it, then rain comes now and then
    S.day++;S.rain=S.day===2||Math.random()<.4;
    render();updateHud();sfx.purr();
    say(S.pal?'You and your friend curl up on your cloud. Zzz…':S.rain?'You curl up on your cloud. Zzz… Listen, rain!':'You curl up on your cloud. Zzz… Good night, cat!','Tap the cat to wake up again');
  });
}

/* ---------- effects ---------- */
function bubble(x,y,text,color){
  x=Math.max(92,Math.min(308,x));const id='b'+(++uid),rx=Math.round(text.length*7.6+20);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" class="bubble" pointer-events="none">
    <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="28" fill="#fff" ${K}/>
    <path d="M${x-10},${y+24} L${x-20},${y+44} L${x+8},${y+25}" fill="#fff" ${K}/>
    <path d="M${x-12},${y+23} L${x+10},${y+23}" stroke="#fff" stroke-width="5"/>
    <text x="${x}" y="${y+9}" text-anchor="middle" class="say" fill="${color}">${text}</text></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1700);
}
function stickerPop(i){
  const id='p'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none" transform="translate(200,150)"><g class="stkpop"><g transform="scale(1.7)">${stkSVG(i)}</g>
    <text y="80" text-anchor="middle" class="say" fill="#e0508a" stroke="#fff" stroke-width="5" paint-order="stroke">NEW STICKER!</text></g></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},2400);
}
function splash(x,y){
  const id='s'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none"><g class="floaty">${[-30,-12,12,30].map((dx,i)=>`<circle cx="${x+dx}" cy="${y-8-(i%2)*10}" r="5" fill="#7cb6e6" stroke="${INK}" stroke-width="1.5"/>`).join('')}</g></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1600);
}
function hearts(x,y){
  for(let i=0;i<3;i++){
    const id='h'+(++uid),hx=x+(i-1)*24;
    stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none"><g class="floaty" style="animation-delay:${i*.15}s">${heart(hx,y-i*6,1.1,'#e0508a')}</g></g>`);
    setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1900);
  }
}
function say(story,hint){
  document.getElementById('story').textContent=story;
  document.getElementById('hint').textContent=hint===undefined?SC[S.scene].goal().hint:hint;
  refreshGoal();
}
function updateHud(){
  document.getElementById('hearts').textContent=S.hearts;
  document.getElementById('tummy').innerHTML=[0,1,2].map(i=>`<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M7,1 C7,1 1,8 1,11 a6,5 0 0 0 12,0 C13,8 7,1 7,1Z" fill="${i<S.tummy?'#fff':'#d7ecfa'}" stroke="#1d1a1f" stroke-width="1.6"/></svg>`).join('');
  document.getElementById('tummyChip').setAttribute('aria-label',`Tummy ${S.tummy} of 3`);
}

/* ---------- sound ---------- */
let AC=null;
function ac(){
  if(!S.sound)return null;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}
  return AC;
}
function seq(type,notes){
  const a=ac();if(!a)return;let t=a.currentTime;
  notes.forEach(([f1,f2,d,v])=>{
    const o=a.createOscillator(),g=a.createGain();o.type=type;
    o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);t+=d+.07;
  });
}
const sfx={
  meow(scared){
    const a=ac();if(!a)return;const t=a.currentTime,d=scared?.8:.6,base=scared?650:480;
    const o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
    o.type='sawtooth';f.type='bandpass';f.frequency.value=scared?1400:1000;f.Q.value=2;
    o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.6,t+d*.35);o.frequency.linearRampToValueAtTime(base*.8,t+d);
    if(scared){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=14;lg.gain.value=45;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+d)}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(scared?.4:.28,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
  },
  purr(){
    const a=ac();if(!a)return;const t=a.currentTime,d=1.4,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
    const g=a.createGain();g.gain.value=.5;const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=24;lg.gain.value=.5;lfo.connect(lg).connect(g.gain);
    const env=a.createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(1.2,t+.2);env.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(env).connect(a.destination);s.start(t);lfo.start(t);s.stop(t+d);lfo.stop(t+d);
  },
  woof(){seq('square',[[260,140,.18,.15],[260,140,.18,.15]])},
  beep(){seq('square',[[520,520,.15,.08],[520,520,.15,.08]])},
  bzz(){seq('sawtooth',[[110,150,.9,.1]])},
  rumble(){seq('sine',[[80,50,.4,.5],[70,45,.5,.5]])},
  slurp(){seq('sine',[[300,700,.12,.15],[300,700,.12,.15]])},
  coin(){seq('triangle',[[660,660,.1,.14],[990,990,.22,.14]])},
  pounce(){seq('sine',[[220,620,.14,.2]])},
  boing(){seq('sine',[[200,520,.15,.2],[520,300,.2,.15]])},
  scrape(){seq('sawtooth',[[95,75,.28,.05]])},
  crash(){
    const a=ac();if(!a)return;const t=a.currentTime,d=.7,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1200;
    const g=a.createGain();g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
    seq('triangle',[[2100,2100,.05,.08],[2700,2700,.05,.06],[1900,1900,.07,.05]]);
  },
  sticker(){seq('triangle',[[523,523,.1,.12],[659,659,.1,.12],[784,784,.22,.12]])},
  stick(){seq('sine',[[300,900,.08,.22]])},
  twinkle(n){const f=[523,587,659,784,880][Math.min(n,5)-1];seq('triangle',[[f,f,.12,.12],[f*2,f*2,.2,.08]])},
  splash(){
    const a=ac();if(!a)return;const t=a.currentTime,d=.45,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(400,t+d);
    const g=a.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
  }
};

/* ---------- input ---------- */
function activate(el){
  if(!el||S.busy)return;
  ac();
  const h=HOTS[el.dataset.id];if(!h)return;
  if(h.walk!==undefined&&$('#cat')){
    let tx=typeof h.walk==='function'?h.walk():h.walk;tx=Math.max(40,Math.min(360,tx));
    walkTo(tx,h.tap);
  }else h.tap();
}
let TAP=null;
stage.addEventListener('click',e=>{
  const m=stage.getScreenCTM();
  TAP=m?new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()):null;
  activate(e.target.closest('.hot'));
});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest&&e.target.closest('.hot');if(el){e.preventDefault();TAP=null;activate(el)}}});
document.getElementById('snd').addEventListener('click',e=>{
  S.sound=!S.sound;e.currentTarget.textContent=S.sound?'♪ ON':'♪ OFF';e.currentTarget.setAttribute('aria-label',S.sound?'Sound on':'Sound off');e.currentTarget.setAttribute('aria-pressed',S.sound);
});

render();updateHud();
</script>
