<title>You Are a Cat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Layout: Carolina's crayon-blue dotted frame holds a tap-to-play stage; the story sits below in blue-pen capitals like her note */
:root{
  --sky:#2c8fd6; --sky-dot:#7cc6f0; --sky-soft:#d7ecfa; --paper:#fffaf6; --ink:#1d1a1f;
  --pen:#1f5fa8; --pink:#f3a3c6; --hot:#e0508a; --gold:#d6ad45;
  --display:"Gochi Hand","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
}
html,body{background:var(--sky-soft);color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,7vw,1.8rem);margin:0;line-height:1;color:var(--hot);text-wrap:balance}
.by{font-size:1rem;color:var(--pen);margin-top:2px}
.hud{order:3;width:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:1.05rem;display:flex;align-items:center;gap:5px;color:var(--ink);font-family:var(--body);line-height:1.4;font-variant-numeric:tabular-nums}
button.chip{cursor:pointer}
.chip[hidden]{display:none}
#menuBtn{font-family:var(--display);font-size:1.3rem;margin-top:4px;max-width:46%;overflow:hidden;white-space:nowrap}
button.chip:focus-visible{outline:3px dashed var(--hot);outline-offset:2px}
.frame{background:var(--sky);background-image:radial-gradient(circle,var(--sky-dot) 0 5px,transparent 6px);background-size:56px 56px;padding:8px;border-radius:6px;border:2.5px solid var(--ink)}
#stage{display:block;width:100%;height:auto;background:var(--paper);border-radius:14px;border:2.5px solid var(--ink);touch-action:manipulation;transition:opacity .3s;-webkit-tap-highlight-color:transparent;user-select:none}
#stage.fade{opacity:0}
.story{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;color:var(--pen);min-height:4.4em}
#story{font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.35;margin:0}
#hint{font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--hot);margin:6px 0 0}

/* svg bits */
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible{outline:3px dashed var(--hot)}
.lbl{font-family:var(--display);font-size:17px;fill:var(--pen);stroke:#fff;stroke-width:4px;paint-order:stroke;letter-spacing:.04em}
.say{font-family:var(--display);font-size:27px;letter-spacing:.03em}
.sign{font-family:var(--display);font-size:26px;fill:var(--pen)}
#catAnim,#palAnim{transform-box:fill-box;transform-origin:50% 100%}
.walk{animation:walk .32s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(-3deg)}75%{transform:translateY(-5px) rotate(3deg)}}
.jump{animation:jump .7s ease-out}
@keyframes jump{0%{transform:none}30%{transform:translateY(-70px) scale(.9,1.12)}60%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
.wiggle{animation:wiggle .9s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.stretch{animation:stretch .9s ease-in-out}
@keyframes stretch{0%,100%{transform:none}40%{transform:scale(1.15,.85)}70%{transform:scale(.92,1.12)}}
.breathe{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05,1)}}
.zzz text{font-family:var(--display);fill:var(--sky);font-size:30px;animation:zz 2.4s ease-out infinite;transform-box:fill-box}
.zzz text:nth-child(2){animation-delay:.6s;font-size:24px}
.zzz text:nth-child(3){animation-delay:1.2s;font-size:20px}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(12px,-22px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
.floaty{animation:floaty 1.5s ease-out both;transform-box:fill-box}
@keyframes floaty{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-80px);opacity:0}}
.bubble{animation:pop .25s ease-out;transform-box:fill-box;transform-origin:center bottom}
@keyframes pop{0%{transform:scale(.3)}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .9s linear;transform-box:fill-box}
@keyframes shake{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:translate(-3px,1px)}20%,40%,60%,80%{transform:translate(3px,-1px)}}
.drive{animation:drive 2.2s ease-in-out}
@keyframes drive{0%{transform:translateX(0)}40%{transform:translateX(200px)}41%{transform:translateX(-420px)}100%{transform:translateX(0)}}
.flap{animation:flap .35s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flap{50%{transform:scaleX(.35)}}
.bfly{transition:transform 1s ease-in-out}
.dot{transition:transform .35s cubic-bezier(.5,0,.2,1),opacity .3s}
.dot.gone{opacity:0;pointer-events:none}
.jit{animation:jit .5s steps(2) infinite}
@keyframes jit{50%{transform:translate(1.5px,-1px)}}
.rainfall{animation:fall .9s linear infinite}
@keyframes fall{to{transform:translateY(520px)}}
.ripple{animation:ripple 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.2);opacity:0}}
/* a new sticker pops up big, waits a moment, then fades away */
.stkpop{animation:stkpop 2.3s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes stkpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}15%{transform:scale(1.15) rotate(4deg);opacity:1}25%{transform:scale(1) rotate(0)}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30px)}}
/* the shy grey cat ducks behind the wall */
.duck{animation:duck 1.5s ease-in-out}
/* the cup wobbles from its bottom when the cat pushes it */
.cupw{transform-box:fill-box;transform-origin:50% 100%}
@keyframes duck{0%,100%{transform:none}25%,70%{transform:translateY(75px)}}
/* snow and autumn leaves drift down slower than rain */
.snowfall{animation:fall 9s linear infinite}
.leaffall{animation:fall 11s linear infinite}
/* a piano key dips when a paw lands on it; the cat dances when it plays the song */
.press{animation:press .3s ease-out}
@keyframes press{40%{transform:translateY(6px)}}
.dance{animation:dance .45s ease-in-out 4}
@keyframes dance{0%,100%{transform:none}25%{transform:translateY(-16px) rotate(-11deg)}50%{transform:scale(1.07,.93)}75%{transform:translateY(-16px) rotate(11deg)}}
/* bath: drops all over the screen when the wet cat shakes; bubbles bob in the air */
.drip{animation:drip 2.6s ease-in both;transform-box:fill-box;transform-origin:center}
@keyframes drip{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.1);opacity:1}30%{transform:scale(1)}100%{transform:translateY(70px);opacity:0}}
.wetshake{animation:wetshake .9s linear}
@keyframes wetshake{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:rotate(-9deg)}20%,40%,60%,80%{transform:rotate(9deg)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-8px)}}
/* the yarn ball rolls when you bat it */
.yarnb{transition:transform .6s ease-out}
/* park: ducks paddle, fish leap out of the pond in an arc */
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.leapx{animation:leapx 1.1s linear both}
@keyframes leapx{to{transform:translateX(80px)}}
.leapy{animation:leapy 1.1s both}
@keyframes leapy{0%{transform:none;animation-timing-function:ease-out}50%{transform:translateY(-95px);animation-timing-function:ease-in}100%{transform:none}}
.leapr{animation:leapr 1.1s linear both}
@keyframes leapr{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
/* players, the pause menu and the top cats board sit on paper over the stage */
.frame{position:relative}
.ov{position:absolute;inset:8px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;overflow:auto;padding:clamp(8px,3vw,14px) clamp(8px,3vw,14px) 16px;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center;font-family:var(--display);color:var(--pen)}
.ov[hidden]{display:none}
.ov>*{flex:none}
.ov input{box-sizing:border-box}
.menuTop{display:flex;align-items:center;gap:12px;text-align:left}
.menuTop>div{flex:1;min-width:0}
.menuTop h2{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menuTop p{white-space:nowrap}
.menuTop .snd{border:2.5px solid var(--ink);border-radius:999px;background:#fff;font-size:1.1rem;padding:4px 10px;min-height:44px;white-space:nowrap}
.ov h2{font-family:var(--display);font-weight:400;font-size:clamp(1.45rem,7vw,1.9rem);line-height:1.05;margin:4px 0 0;color:var(--hot);text-wrap:balance}
.ov p{margin:0;font-size:clamp(1rem,4.6vw,1.25rem);letter-spacing:.04em;text-transform:uppercase}
.ov button{font-family:var(--display);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ov button:focus-visible,.ov input:focus-visible{outline:3px dashed var(--hot);outline-offset:2px}
.big{min-height:54px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;font-size:clamp(1.2rem,6vw,1.6rem);letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 10px;box-shadow:0 4px 0 var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big.pink{background:var(--pink)}.big.blue{background:#9fd0ef}.big.gold{background:#ffd98a}.big.green{background:#c9e6a8}
.big.small{min-height:46px;font-size:clamp(1rem,4.6vw,1.25rem)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.row .big{white-space:normal;line-height:1.1}
.cats{display:flex;flex-direction:column;gap:10px}
.card{position:relative;display:flex}
.card .pick{flex:1;min-width:0;justify-content:flex-start;text-align:left;padding-right:50px}
.card .pick>span{min-width:0}
.card .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);font-size:1.5rem;line-height:1;color:var(--ink)}
.mini{width:clamp(38px,12vw,52px);height:clamp(48px,15vw,64px);flex:none}
.nm{display:block;font-size:clamp(1.3rem,6vw,1.7rem);line-height:1;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;white-space:nowrap;font-size:1.05rem;color:var(--pen);font-family:var(--body);letter-spacing:.05em}
.ov input{font-family:var(--display);font-size:1.8rem;text-align:center;text-transform:uppercase;letter-spacing:.06em;border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;background:#fff;color:var(--hot);width:100%;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugg button{border:2.5px solid var(--ink);border-radius:999px;background:var(--sky-soft);font-size:1.2rem;padding:2px 12px;min-height:44px}
.board{display:flex;flex-direction:column;gap:8px}
.rank{display:flex;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:16px;padding:4px 12px;background:#fff;text-align:left}
.rank.me{background:#fde6ee}
.medal{width:34px;height:34px;flex:none;border-radius:50%;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--ink);background:var(--paper)}
.rank .nm{flex:1;min-width:0;font-size:clamp(1.2rem,5.5vw,1.5rem)}
.rank{padding:4px 8px;gap:8px}
.score{font-size:clamp(1.2rem,5.5vw,1.6rem);color:var(--ink);white-space:nowrap}
.star{color:var(--gold);-webkit-text-stroke:1px var(--ink)}
.bump{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){
  .walk,.pulse,.breathe,.flap,.zzz text,.jit,.rainfall,.ripple,.snowfall,.leaffall,.bob,.swim{animation:none}
  .bump,.jump,.wiggle,.stretch,.shake,.drive,.stkpop,.duck,.press,.dance,.drip,.wetshake,.leapx,.leapy,.leapr{animation-duration:.01s}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>You Are a Cat</h1>
      <div class="by">A game by Carolina</div>
    </div>
    <button class="chip" id="menuBtn" type="button" aria-label="Menu" hidden>☰ <span id="who"></span></button>
    <div class="hud">
      <span class="chip" aria-label="Hearts"><svg width="18" height="18" viewBox="-14 -14 28 24" aria-hidden="true"><path d="M0,8 C-10,0 -14,-7 -7,-11 C-3,-13 0,-10 0,-7 C0,-10 3,-13 7,-11 C14,-7 10,0 0,8Z" fill="#e0508a" stroke="#1d1a1f" stroke-width="2"/></svg><span id="hearts">0</span></span>
      <span class="chip" id="tummyChip" aria-label="Tummy">TUMMY <span id="tummy"></span></span>
      <span class="chip" id="ptsChip" aria-label="Points"><span class="star" aria-hidden="true">★</span><span id="pts">0</span></span>
    </div>
  </header>

  <div class="frame">
    <svg id="stage" viewBox="0 0 400 520" role="group" aria-label="The cat game"></svg>
    <div class="ov" id="ov" hidden></div>
  </div>

  <div class="story" aria-live="polite">
    <p id="story">You are a cat. You are asleep.</p>
    <p id="hint">Tap the cat to wake up!</p>
  </div>
</div>

<script>
const INK='#1d1a1f';
const K=`stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const HEART="M0,8 C-10,0 -14,-7 -7,-11 C-3,-13 0,-10 0,-7 C0,-10 3,-13 7,-11 C14,-7 10,0 0,8Z";
const BODY="M-19,-80 L-21,-8 Q-21,2 -12,2 Q-3,2 -3,-8 L-2,-18 L3,-18 L4,-7 Q4,2 13,2 Q21,2 21,-8 L18,-80 Z";
const FLOOR=450;
const stage=document.getElementById('stage');
const $=s=>stage.querySelector(s);
let uid=0, moodT=null;

const S={scene:'bed',awake:false,tummy:0,hearts:0,x:200,face:1,mood:'sleep',fridge:false,bowl:0,fly:{x:300,y:200},busy:false,sound:true,fish:false,
  day:1,rain:false,umbrella:false,dot:{x:300,y:478,n:0,hid:false},stars:[],wink:false,
  earned:0,stk:[],newStk:[],pal:false,palX:136,palFace:1,
  box:'door',cup:0,sDone:false,stamps:0,prints:[],
  piano:false,song:0,songAt:0,danced:false,lastKey:-1,lastNote:-1,noteT:0,
  hat:'',bow:false,glasses:false,dressed:false,yarn:0,bath:false,pops:[],party:false,bird:'here',park:false,pondN:0,quackN:0,
  points:0,today:0,done:[]};
const FISH=5, UMB=2;
// a birthday comes on day 3 and then every five days
const bday=()=>S.day%5===3;
// the bird on the kitchen windowsill sings a new little tune each day
const BIRDS=[[7,5,7],[4,7,4],[2,4,7],[7,6,4],[5,7,5]];
const birdTune=()=>BIRDS[(S.day-1)%BIRDS.length];
// the yarn ball rolls along the bedroom floor, one bat at a time
const YARNX=[70,160,250], YARNR=[20,16,12];
// bubbles over the bath, to pop
const BUBS=[[70,250],[150,170],[240,215],[330,165],[90,120],[260,100]];
// what is in the dress-up drawer; c is the middle of each thing in cat coordinates
const ITEMS=[
  {id:'crown',slot:'hat',name:'crown',c:[0,-144]},
  {id:'tophat',slot:'hat',name:'top hat',c:[0,-150]},
  {id:'bow',slot:'bow',name:'bow',c:[18,-127]},
  {id:'glasses',slot:'glasses',name:'heart glasses',c:[0,-104]}
];
const wearing=it=>it.slot==='hat'?S.hat===it.id:S[it.slot];
// how high above the floor speech bubbles go for each hat
const HATH={box:226,tophat:230,crown:216,party:242};
// every nap moves the season on; day 1 is summer
const SEASONS=['summer','autumn','winter','spring'];
const season=()=>SEASONS[(S.day-1)%4];
const snowy=()=>season()==='winter';
// the toy piano: eight rainbow keys from do to do, and little songs to play from the music sheet
const KEYC=['#e8473f','#f9a03f','#ffd34d','#7fc36b','#3cb8b0','#2c8fd6','#8a6bd1','#f38db5'];
const NOTE=[262,294,330,349,392,440,494,523];
const SOLFA=['DO','RE','MI','FA','SOL','LA','TI','DO'];
const SONGS=[[0,2,4],[4,5,7],[7,4,0],[1,3,5],[6,4,2],[0,4,7]];
const KEY0=20, KEYW=45;
const keyAt=x=>x<KEY0||x>=KEY0+8*KEYW?-1:Math.floor((x-KEY0)/KEYW);
// where paw prints go in the patch of fresh snow
const PAWS=[[362,446],[374,452],[384,440],[392,450],[370,436],[386,456]];
const STARS=[[60,84],[150,48],[222,146],[96,206],[364,214]];
const WORDS=['One','Two','Three','Four','Five'];
// the cup slides along the kitchen counter, one push at a time; the counter ends at x=304
const CUPX=[290,297,303];
// every time the total of hearts ever earned reaches one of these, a new sticker unlocks
const STK_AT=[3,6,10,15,21,28,36,45];
// the big fridge door in the sticker scene, and the small closed fridge in the kitchen
const DOOR={x:115,y:14,w:170,h:433}, FRIDGE={x:22,y:170,w:110,h:280};
const PINK={head:'#a8652f',body:'#f3a3c6',ear:'#f1e05a'}, GREY={head:'#8d8d9a',body:'#d3d4dc',ear:'#f3a3c6'};
let T=[];
function later(fn,ms){T.push(setTimeout(fn,ms))}
function clearLater(){T.forEach(clearTimeout);T=[];clearTimeout(moodT)}
const homeward=()=>S.tummy>=3&&S.fish==='eaten';
const night=homeward;
const outside=()=>S.scene==='city'||S.scene==='park';
const umbOn=()=>outside()&&S.rain&&S.umbrella;
// speech bubbles sit above the cat's head, or above its hat or umbrella
const headY=()=>FLOOR-(umbOn()?268:HATH[S.hat]||190);
const fridgeShut=()=>!S.fridge||(S.tummy>=3&&S.bowl===0);

/* every cat has a name and its own saved game, kept on this device; the newest save is the one to continue */
const SAVE='you-are-a-cat';
const FRESH=JSON.stringify(S);
try{S.sound=localStorage.getItem(SAVE+'-sound')!=='0'}catch(e){}
// things that only matter while a scene is on screen are not saved
const NOSAVE=['busy','sound','fly','dot','lastKey','lastNote','noteT','prints'];
let DB={cats:[]}, CUR=null, GEN=0;
const curCat=()=>DB.cats.find(c=>c.id===CUR);
const nm=()=>(curCat()||{name:'cat'}).name;
const score=c=>Math.max(c.best||0,c.s&&c.s.points||0);
function store(){try{localStorage.setItem(SAVE,JSON.stringify(DB))}catch(e){}}
function save(){
  const c=curCat();if(!c)return;
  const s={};for(const k in S) if(!NOSAVE.includes(k)) s[k]=S[k];
  c.s=s;c.best=Math.max(c.best||0,S.points);c.at=Date.now();store();
}
try{
  const v=JSON.parse(localStorage.getItem(SAVE)||'null');
  if(v&&Array.isArray(v.cats)) DB={cats:v.cats.filter(c=>c&&c.id&&c.name)};
  // the first saves only kept stickers and the friend: they go to a cat called Kitty
  else if(v&&Array.isArray(v.stk)) DB={cats:[{id:'kitty',name:'KITTY',best:0,at:1,s:{earned:+v.earned||0,stk:v.stk,newStk:Array.isArray(v.newStk)?v.newStk:[],pal:!!v.pal}}]};
}catch(e){}
// put a saved game back, tidying anything that was halfway through when it was saved
function loadState(s){
  Object.assign(S,JSON.parse(FRESH),s||{},{sound:S.sound,busy:false});
  if(!SC[S.scene]||!S.awake) S.scene='bed';
  S.mood=S.awake?'normal':'sleep';S.x=200;S.face=1;S.palX=136;S.palFace=1;
  if(S.cup==='fall') S.cup='broken';
  if(S.box==='in'){S.box='gone';S.hat='box'}
  if(S.bath==='shake'||(S.bath==='in'&&S.pops.length>=BUBS.length)) S.bath='done';
  if(!Array.isArray(S.done)) S.done=[];
}

/* points: one for every heart, a few for each fun thing done today, and a bonus for every day that ends in a nap */
const FUN=[['milk',()=>S.tummy>=3],['fish',()=>S.fish==='eaten'],['dress',()=>S.dressed],['yarn',()=>S.yarn==='done'],
  ['box',()=>S.box==='gone'],['cup',()=>S.cup==='broken'],['bird',()=>S.bird==='sang'||S.bird==='copied'],['song',()=>S.danced],
  ['party',()=>S.party],['park',()=>S.park],['season',()=>S.sDone],['bath',()=>S.bath==='done'],
  ['stars',()=>S.stars.length>=STARS.length],['moon',()=>S.wink]];
const FUNPTS=3, NAPPTS=5;
function checkFun(){
  if(!CUR)return;
  let n=0;FUN.forEach(([k,t])=>{if(!S.done.includes(k)&&t()){S.done.push(k);n+=FUNPTS}});
  if(n){addPoints(n);floatPts(n)}
}
function addPoints(n){
  S.points+=n;S.today+=n;updateHud();
  const c=document.getElementById('ptsChip');c&&restartClass(c,'bump',500);
}

function cloud(cx,cy,rx,ry,n){
  let d='';
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2, x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    if(i===0){d+=`M${x.toFixed(1)},${y.toFixed(1)}`}
    else{const m=(i-.5)/n*Math.PI*2;d+=`Q${(cx+rx*1.3*Math.cos(m)).toFixed(1)},${(cy+ry*1.3*Math.sin(m)).toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`}
  }
  return d+'Z';
}

function arrow(side,label){
  const x=side==='left'?40:360;
  const d=side==='left'
    ?`M${x+11},52 H${x-11} M${x-2},42 L${x-12},52 L${x-2},62`
    :`M${x-11},52 H${x+11} M${x+2},42 L${x+12},52 L${x+2},62`;
  return `<circle cx="${x}" cy="52" r="25" fill="#fffaf6" ${K}/><path d="${d}" fill="none" stroke="#2c8fd6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="${side==='left'?14:386}" y="98" text-anchor="${side==='left'?'start':'end'}" class="lbl">${label}</text>`;
}

  return `<g pointer-events="none"><g class="rainfall"><path d="${d}" stroke="#3f7fc4" stroke-width="2.5" stroke-linecap="round" opacity=".7"/></g></g>`;
}

/* seasons: autumn leaves, winter snow, spring flowers */
const leaf=(x,y,r,c)=>`<path transform="translate(${x},${y}) rotate(${r})" d="M0,-8 Q8,-2 0,8 Q-8,-2 0,-8Z M0,-6 V7" fill="${c}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
const LEAFC=['#e8742a','#d9363e','#f1b13a','#a8652f'];
function flake(x,y,r){
  const d=`M0,${-r} V${r} M${-.87*r},${-.5*r} L${.87*r},${.5*r} M${-.87*r},${.5*r} L${.87*r},${-.5*r}`;
  return `<g transform="translate(${x},${y})"><path d="${d}" stroke="#7cc6f0" stroke-width="4.5" stroke-linecap="round"/><path d="${d}" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>`;
}
const blossom=(x,y,c,s=1)=>`<g transform="translate(${x},${y}) scale(${s})">${[0,1,2,3,4].map(i=>{const a=i*Math.PI*2/5-Math.PI/2;return `<circle cx="${(5*Math.cos(a)).toFixed(1)}" cy="${(5*Math.sin(a)).toFixed(1)}" r="4" fill="${c}" stroke="${INK}" stroke-width="1.4"/>`}).join('')}<circle r="2.8" fill="#ffd34d" stroke="${INK}" stroke-width="1.2"/></g>`;
const paneSky=()=>S.rain?'#a9bccc':snowy()?'#dce8f3':'#bfe3fa';
// what you see through a window in the daytime
function seasonPane(x,y,w,h){
  const s=season();
  if(s==='winter') return `<path d="M${x+2},${y+h-2} V${y+h-12} q${w/4},-9 ${w/2},0 t${w/2},0 V${y+h-2}Z" fill="#fff"/>${flake(x+w*.22,y+h*.3,5)}${flake(x+w*.62,y+h*.2,4)}${flake(x+w*.82,y+h*.55,5)}${flake(x+w*.4,y+h*.6,4)}`;
  if(s==='autumn') return `${leaf(x+w*.25,y+h*.62,30,'#e8742a')}${leaf(x+w*.7,y+h*.35,-40,'#d9363e')}`;
  if(s==='spring') return `${blossom(x+w*.2,y+h*.78,'#f38db5',.9)}${blossom(x+w*.82,y+h*.8,'#fff',.9)}`;
  return '';
}
// snowflakes or leaves drifting over the whole stage, laid out like the rain so they loop seamlessly
function fallers(n,art,cls){
  let s='';for(let i=0;i<n;i++){const x=(i*73)%400+(i%3)*9,y=(i*131)%520;s+=art(x,y,i)+art(x,y-520,i)}
  return `<g pointer-events="none"><g class="${cls}">${s}</g></g>`;
}
const snowfall=()=>fallers(20,(x,y,i)=>flake(x,y,3+i%3),'snowfall');
const leaffall=()=>fallers(7,(x,y,i)=>leaf(x,y,i*47,LEAFC[i%4]),'leaffall');

function seasonTap(){
  const s=season(),an=$('#catAnim');S.sDone=true;S.face=1;$('#catFlip').setAttribute('transform','scale(1,1)');
  if(s==='autumn'){
    an&&restartClass(an,'jump',700);sfx.crunch();burst(374,430,(x,y,i)=>leaf(x,y,i*60,LEAFC[i%4]));
    later(()=>react('happy'),450);say('Crunch crunch! You jump in the leaves!');
  }else if(s==='winter'){
    S.stamps=S.stamps>=PAWS.length?1:S.stamps+1;render();sfx.crunch(true);react('happy');
    say(S.stamps>=PAWS.length?'Pat pat pat! Lots of paw prints in the snow!':'Pat! Your paw makes a print in the snow. Brrr!');
  }else{
    S.busy=true;bubble(S.x,headY(),'SNIFF SNIFF','#4f9c45');say('Sniff sniff… the flowers smell so nice…','');
    later(()=>{const a=$('#catAnim');a&&restartClass(a,'jump',700);sfx.achoo();stage.querySelectorAll('.bubble').forEach(e=>e.remove());bubble(S.x,headY(),'ACHOO!','#e0508a');burst(374,410,(x,y,i)=>`<circle cx="${x}" cy="${y}" r="4" fill="${['#f38db5','#fff','#ffd34d'][i%3]}" stroke="${INK}" stroke-width="1.2"/>`)},1300);
    later(()=>{S.busy=false;react('happy');say('Achoo! The flowers tickle your nose. Poooourrr!')},2700);
  }
}

function pianoKey(i){
  const x=KEY0+i*KEYW;
  return `<g class="k${i}"><rect x="${x}" y="330" width="${KEYW}" height="140" rx="6" fill="#fff" ${K}/><rect x="${x+5}" y="335" width="${KEYW-10}" height="24" rx="4" fill="${KEYC[i]}" stroke="${INK}" stroke-width="2"/></g>`;

// the music sheet shows the song as colored notes; the ones already played get a star
function sheet(){
  const song=curSong();
  let l='';for(let y=192;y<=252;y+=15)l+=`M124,${y} H276 `;
  return `<rect x="110" y="168" width="180" height="104" rx="6" fill="#fff" ${K}/><path d="${l}" stroke="#9fd0ef" stroke-width="2"/>
  ${song.map((k,j)=>{const x=150+j*50,y=252-k*7.5;return `<path d="M${x+10},${y} V${y-34}" stroke="${INK}" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="11" fill="${KEYC[k]}" ${K} stroke-width="2.5"/>${j<S.songAt?`<path d="${starPath(x,y-22,8)}" fill="#ffd34d" stroke="${INK}" stroke-width="1.6"/>`:''}`}).join('')}
  ${S.bird==='sang'?bird(128,194):''}`;
}
function playKey(i){
  sfx.note(i);S.lastNote=i;S.noteT=performance.now();
  const k=$('.k'+i);k&&restartClass(k,'press',300);
  floatNote(KEY0+i*KEYW+KEYW/2,318,KEYC[i]);
}
function tapKey(i){
  // walking onto the key already played it, so only play it again if that was a while ago
  if(!(S.lastNote===i&&performance.now()-S.noteT<400)) playKey(i);
  const song=curSong();
  bubble(KEY0+i*KEYW+KEYW/2,292,SOLFA[i]+'!',KEYC[i]);
  if(i!==song[S.songAt]){say(`${SOLFA[i][0]+SOLFA[i].slice(1).toLowerCase()}! Your paw plays a note.`);return}
  S.songAt++;const sh=$('#sheet');sh&&(sh.innerHTML=sheet());
  if(S.songAt>=song.length) dance();
  else say(S.songAt===1?'Plink! That is the first note!':'Plonk! One more…');
}
function dance(){
  S.busy=true;S.danced=true;
  const song=curSong(),fromBird=S.bird==='sang';
  song.forEach((k,j)=>later(()=>{playKey(k);fromBird&&sfx.chirp(k)},300+j*240));
  later(()=>sfx.chord(),300+song.length*240);
  setMood('happy');const an=$('#catAnim'),pa=$('#palAnim');an&&restartClass(an,'dance',1800);pa&&restartClass(pa,'dance',1800);
  bubble(S.x,headY(),'LA LA LA!','#8a6bd1');
  say(fromBird?'You play the bird\'s song! Far away, the bird sings with you. Tweet tweet!'
    :S.pal?'You play the song… and you and your friend dance! Cha cha cha!':'You play the song… and you dance! Cha cha cha!','');
  later(()=>{
    if(fromBird)S.bird='copied';else S.song=(S.song+1)%SONGS.length;
    S.songAt=0;const sh=$('#sheet');sh&&(sh.innerHTML=sheet());
    S.busy=false;react('happy');say(fromBird?'You and the bird make music! Poooourrr!':'What a dance! Poooourrr! Look, a new song.');
  },2000);
}

/* the yarn ball on the bedroom floor and the pink trail it leaves */
function yarnBall(r){
  return `<circle r="${r}" fill="#f38db5" ${K}/><path d="M${-r*.75},${-r*.45} Q0,${r*.25} ${r*.75},${-r*.5} M${-r*.85},${r*.2} Q0,${r*.85} ${r*.6},${r*.65} M${-r*.25},${-r*.95} Q${r*.55},0 ${r*.1},${r*.95}" fill="none" stroke="#c23a68" stroke-width="2"/>`;
}
function yarnTrail(x1,x2){
  if(x2-x1<16) return '';
  let d=`M${x1},490`;for(let x=x1;x+16<=x2;x+=16)d+=' q4,-7 8,0 t8,0';
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="5.5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#f38db5" stroke-width="3" stroke-linecap="round"/>`;
}
function yarnHot(){
  const n=typeof S.yarn==='number'?S.yarn:0, t=S.yarn==='tangled', done=S.yarn==='done';
  const bx=t?Math.min(370,S.x+48):done?300:YARNX[n], r=t||done?9:YARNR[n];
  return `${yarnTrail(70,t?S.x:bx)}<g class="yarnb" style="transform:translate(${bx}px,${490-r}px) rotate(${n*200}deg)"><circle r="30" fill="transparent"/>${yarnBall(r)}</g>`;
}

  <path d="M15,-18 l8,2 l-7,3Z" fill="#f9a03f" stroke="${INK}" stroke-width="${(1.6/s).toFixed(2)}"/><circle cx="8" cy="-17" r="1.8" fill="${INK}"/>
  <path d="M-8,-4 q6,4 12,-1" fill="none" stroke="${INK}" stroke-width="${(1.8/s).toFixed(2)}" stroke-linecap="round"/></g>`;
}
function tub(){
  const wet=S.bath!=='done'&&S.bath!=='shake';
  let foam='';if(wet)for(let x=118;x<=322;x+=20)foam+=`<circle cx="${x}" cy="${330+(x%40?2:-3)}" r="${x%40?10:13}" fill="#fff" stroke="#9fd0ef" stroke-width="2"/>`;
  return `<rect x="100" y="270" width="240" height="182" fill="transparent"/>
  ${S.bath==='in'?`<g transform="translate(220,388) scale(.82)">${catSVG('scared',false,false,PINK,wearNow())}</g>`:''}
  <path d="M106,338 H334 Q336,430 272,432 H168 Q104,430 106,338Z" fill="#fff" ${K}/>
  <path d="M146,430 l-8,18 M294,430 l8,18" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M146,430 l-8,18 M294,430 l8,18" stroke="#d6ad45" stroke-width="5" stroke-linecap="round"/>

  ${heart(220,392,1.3,'#f6b3cb')}${foam}`;
}
function bathBubble(i){

  return `<circle cx="${x}" cy="${y}" r="32" fill="transparent"/><g class="bob" style="animation-delay:-${i*.4}s"><circle cx="${x}" cy="${y}" r="21" fill="#eaf7ff" fill-opacity=".75" ${K} stroke-width="2.5"/>

// big drops all over the stage when the wet cat shakes
function wetScreen(){
  const id='w'+(++uid);let s='';
  for(let i=0;i<18;i++){
    const x=(i*83)%370+15,y=(i*137)%430+30,r=6+(i%3)*3;
    s+=`<g transform="translate(${x},${y})"><g class="drip" style="animation-delay:${(i%6)*.08}s"><path d="M0,${-r*1.7} Q${r},${-r*.3} ${r},${r*.3} A${r},${r} 0 1 1 ${-r},${r*.3} Q${-r},${-r*.3} 0,${-r*1.7}Z" fill="#7cc6f0" fill-opacity=".8" stroke="${INK}" stroke-width="1.6"/></g></g>`;
  }
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none">${s}</g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},3000);
}

function bunting(){
  let s='';
  for(let i=0;i<9;i++){
    const t=(i+.5)/9,x=(1-t)*(1-t)*80+2*(1-t)*t*236+t*t*392,y=(1-t)*(1-t)*18+2*(1-t)*t*58+t*t*18;
    s+=`<path d="M${(x-12).toFixed(1)},${y.toFixed(1)} L${(x+12).toFixed(1)},${y.toFixed(1)} L${x.toFixed(1)},${(y+24).toFixed(1)}Z" fill="${KEYC[i%8]}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  return `<path d="M80,18 Q236,58 392,18" fill="none" stroke="${INK}" stroke-width="2.5"/>${s}`;
}

function parkDuck(i){

  return `<circle cx="${x}" cy="${y-8}" r="30" fill="transparent"/><g class="swim" style="animation-delay:-${i*2}s"><g class="dk${i}" style="transform-box:fill-box;transform-origin:50% 100%">

const fishArt=`<path d="M14,0 q-11,-11 -22,0 q11,11 22,0Z M-8,0 l-9,-7 v14Z" fill="#f9a03f" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><circle cx="7" cy="-2" r="1.8" fill="${INK}"/>`;
// a fish jumps out at x0 and dives back in 80 to the right (dir 1) or left (dir -1)
function leap(x0,dir){
  const id='f'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none" transform="translate(${x0},392) scale(${dir},1)"><g class="leapx"><g class="leapy"><g class="leapr">${fishArt}</g></g></g></g>`);
  splash(x0,396);setTimeout(()=>{splash(x0+dir*80,396);sfx.plop()},1050);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1200);
}
function ambientLeap(){
  if(S.scene!=='park'||night())return;
  leap(210+Math.random()*80,Math.random()<.5?1:-1);
  later(ambientLeap,3800+Math.random()*2500);
}

/* ---------- render ---------- */
function catLayer(){
  if(SC[S.scene].noCat||S.box==='in'||(S.scene==='bath'&&S.bath==='in')) return '';
  if(S.scene==='bed'&&!S.awake){
    return `${S.pal?`<g pointer-events="none" transform="translate(306,432) rotate(-84) scale(.62)"><g class="breathe" style="transform-box:fill-box;transform-origin:50% 100%">${catSVG('sleep',false,false,GREY)}</g></g>`:''}
      <g class="hot${SC.bed.goal().id==='cat'?' pulse':''}" data-id="cat" role="button" tabindex="0" aria-label="Sleeping cat">
      <g transform="translate(272,396) rotate(-84)"><g id="catAnim" class="breathe">${catSVG('sleep')}</g></g></g>
      <g class="zzz" pointer-events="none"><text x="120" y="318">Z</text><text x="146" y="296">z</text><text x="166" y="278">z</text></g>`;
  }
  const pet=S.scene==='bed'?'class="hot" data-id="cat" role="button" tabindex="0" aria-label="Pet the cat"':'pointer-events="none"';
  return `<g id="cat" ${pet} transform="translate(${S.x},${FLOOR})"><g id="catFlip" transform="scale(${S.face},1)"><g id="catAnim">${catArt(S.mood)}</g></g></g>`;
}
const catArt=m=>catSVG(m,S.fish==='carry',umbOn(),PINK,wearNow());
// the friend walks behind the cat; it sits under the other hotspots so it never blocks them, and can be tapped for a cuddle
function palLayer(){
  if(!S.pal||SC[S.scene].noCat||(S.scene==='bed'&&!S.awake)) return '';
  return `<g class="hot" data-id="pal" role="button" tabindex="0" aria-label="Your grey cat friend"><g id="pal" transform="translate(${S.palX.toFixed(1)},${FLOOR}) scale(.82)"><g id="palFlip" transform="scale(${S.palFace},1)"><g id="palAnim">${catSVG('normal',false,false,GREY,{hat:S.party?'party2':''})}</g></g></g></g>`;
}
let HOTS={};
function render(){
  const sc=SC[S.scene], p=sc.goal().id, hs=sc.hots();
  HOTS={};hs.forEach(h=>HOTS[h.id]=h);
  if(S.scene==='bed') HOTS.cat={id:'cat',tap:!S.awake?wake:S.yarn==='tangled'?unTangle:pet};
  if(S.pal) HOTS.pal={id:'pal',tap:petPal};
  const ae=document.activeElement, fid=stage.contains(ae)&&ae.dataset?ae.dataset.id:null;
  const prints=outside()&&snowy()?`<g id="prints" pointer-events="none">${S.prints.map(p=>pawSVG(p.x,p.y,p.f,'#b9cde0')).join('')}</g>`:'';
  stage.innerHTML=DEFS+`<g filter="url(#wob)">${sc.draw()}</g>`+prints+palLayer()+
    hs.map(h=>`<g class="hot${p===h.id?' pulse':''}" data-id="${h.id}" role="button" tabindex="0" aria-label="${h.label}">${h.svg}</g>`).join('')+
    catLayer()+(sc.over?sc.over():'');
  const f=fid&&$(`[data-id="${fid}"]`);f&&f.focus();
}
function refreshGoal(){const id=SC[S.scene].goal().id;stage.querySelectorAll('.hot').forEach(el=>el.classList.toggle('pulse',el.dataset.id===id&&el.id!=='cat'))}
function redraw(){render()}

/* ---------- cat actions ---------- */
function setMood(m){S.mood=m;const a=$('#catAnim');if(a&&!(S.scene==='bed'&&!S.awake))a.innerHTML=catArt(m)}
function restartClass(el,cls,ms){el.classList.remove(cls);el.getBoundingClientRect();el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
function walkTo(tx,cb){
  const dist=tx-S.x;
  if(Math.abs(dist)<4){cb&&cb();return}
  S.busy=true;S.face=dist<0?-1:1;
  const flip=$('#catFlip'),an=$('#catAnim'),cat=$('#cat');
  if(!cat){S.busy=false;cb&&cb();return}
  flip.setAttribute('transform',`scale(${S.face},1)`);an.classList.add('walk');
  const sx=S.x,dur=Math.abs(dist)/.22,t0=performance.now(),g=GEN;let px=sx;
  (function step(t){
    if(g!==GEN){an.classList.remove('walk');return}
    const p=Math.min(1,(t-t0)/dur);S.x=sx+dist*p;cat.setAttribute('transform',`translate(${S.x},${FLOOR})`);follow();
    // each paw on the piano plays the key under it; in the snow, paws leave prints
    if(S.scene==='piano'){const k=keyAt(S.x);if(k!==S.lastKey){S.lastKey=k;k>=0&&playKey(k)}}
    if(outside()&&snowy()&&Math.abs(S.x-px)>=18){px=S.x;addPrint()}
    if(p<1)requestAnimationFrame(step);else{an.classList.remove('walk');S.busy=false;cb&&cb()}
  })(t0);
}
function leave(tx,cb){walkTo(tx,cb)}
let palRaf=0;
function follow(){
  if(palRaf||!S.pal)return;
  const tick=()=>{
    const el=$('#pal'),fl=$('#palFlip'),an=$('#palAnim');
    if(!el){palRaf=0;return}
    const tx=Math.max(30,Math.min(370,S.x-62*S.face)),d=tx-S.palX;
    if(Math.abs(d)<1.5){
      palRaf=0;an.classList.remove('walk');S.palFace=S.x>=S.palX?1:-1;fl.setAttribute('transform',`scale(${S.palFace},1)`);return;
    }
    S.palX+=Math.sign(d)*Math.min(Math.abs(d)*.12+.4,4.2);S.palFace=Math.sign(d);
    el.setAttribute('transform',`translate(${S.palX.toFixed(1)},${FLOOR}) scale(.82)`);fl.setAttribute('transform',`scale(${S.palFace},1)`);an.classList.add('walk');
    palRaf=requestAnimationFrame(tick);
  };
  palRaf=requestAnimationFrame(tick);
}
// from: 'left' or 'right' walks in from that edge; a number puts the cat right there (top or bottom of a ladder)
function go(name,from){
  clearLater();S.busy=true;stage.classList.add('fade');const g=GEN;
  setTimeout(()=>{
    if(g!==GEN)return;
    const at=typeof from==='number';
    S.scene=name;S.x=at?from:from==='left'?-50:450;S.face=1;S.mood='normal';
    S.palX=at?Math.max(30,from-62):from==='left'?-120:520;S.prints=[];S.lastKey=-1;
    SC[name].before&&SC[name].before();render();updateHud();
    stage.classList.remove('fade');SC[name].enter();
    if(at){const an=$('#catAnim');an&&restartClass(an,'stretch',900);S.busy=false}
    else walkTo(from==='left'?SC[name].landLeft||80:SC[name].landRight||320,()=>{});
    follow();
  },300);
}
function react(kind,earn=true){
  clearTimeout(moodT);
  const an=$('#catAnim');
  const by=headY();
  if(kind==='scared'){setMood('scared');an&&restartClass(an,'jump',700);bubble(S.x,by,'MIAAWOW!','#d9363e');sfx.meow(true)}
  else{setMood('happy');an&&restartClass(an,'wiggle',900);bubble(S.x,by,'POOOOURRR','#e0508a');sfx.purr();if(earn){hearts(S.x,FLOOR-150);earnHeart()}}
  moodT=setTimeout(()=>setMood('normal'),1600);
}
function earnHeart(){
  S.hearts++;S.earned++;addPoints(1);
  const i=STK_AT.indexOf(S.earned);
  if(i<0){save();return}
  S.newStk.push(i);save();
  // after the caller has told its own story, add the news and show the sticker big
  setTimeout(()=>{document.getElementById('story').textContent+=' New sticker!';refreshGoal()},0);
  setTimeout(()=>{stickerPop(i);sfx.sticker()},700);
}
function stickIt(){

  S.stk.push({i,x:Math.round(Math.max(DOOR.x+28,Math.min(DOOR.x+DOOR.w-28,p.x))),y:Math.round(Math.max(DOOR.y+28,Math.min(DOOR.y+DOOR.h-28,p.y))),r:Math.round(Math.random()*28-14)});
  save();sfx.stick();render();
  const el=$('.stk'+(S.stk.length-1));el&&restartClass(el,'stretch',900);

function pounce(){
  const d=S.dot,an=$('#catAnim'),el=$('.dot');if(d.hid||!el)return;
  an&&restartClass(an,'jump',700);sfx.pounce();d.n++;

    // third pounce: the dot zips under the sofa and comes back a bit later
    d.x=200;d.y=440;d.hid=true;el.style.transform=`translate(${d.x}px,${d.y}px)`;el.classList.add('gone');
    later(()=>react('happy'),650);say('Pounce! Zip… the dot hides under the sofa!','Tap the sofa to look');
    later(()=>{d.hid=false;d.n=0;d.x=90+Math.random()*200;d.y=470;el.style.transform=`translate(${d.x}px,${d.y}px)`;el.classList.remove('gone');say('The red dot is back!','Catch the red dot!')},5000);
  }else{
    d.x=d.x>200?60+Math.random()*110:230+Math.random()*100;d.y=[470,492,300,260][Math.floor(Math.random()*4)];
    el.style.transform=`translate(${d.x}px,${d.y}px)`;
    later(()=>react('happy'),650);say('Pounce! The dot zips away. Catch it again!');
  }
}
function countStar(i){
  if(S.stars.includes(i)){const [x,y]=STARS[i];bubble(x,y+60,`${WORDS[S.stars.indexOf(i)]}!`,'#d6ad45');return}
  S.stars.push(i);const n=S.stars.length,[x,y]=STARS[i];

  else{react('happy');say('Five stars! You counted them all. Poooourrr!')}
}

function pushCup(){
  S.face=1;$('#catFlip').setAttribute('transform','scale(1,1)');
  if(S.cup>=2){fallCup();return}
  S.cup++;clearTimeout(moodT);S.mood='push';render();sfx.scrape();
  const c=$('.cupw');c&&restartClass(c,'wiggle',900);
  moodT=setTimeout(()=>setMood('normal'),700);
  say(S.cup===1?'You push the cup with your paw. Slowly…':'Slowly… slowly… It is on the edge!');
}
function fallCup(){
  S.busy=true;S.cup='fall';clearTimeout(moodT);S.mood='push';render();sfx.scrape();say('One more push…','');
  const id='c'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none" transform="translate(303,322) rotate(9)">${cupArt()}</g>`);
  const g=document.getElementById(id);
  later(()=>{
    const t0=performance.now();
    (function step(t){
      const p=Math.max(0,Math.min(1,(t-t0)/600));
      g.setAttribute('transform',`translate(${303+22*p},${322+170*p*p}) rotate(${9+120*p})`);
      if(p<1)requestAnimationFrame(step);else crash();
    })(t0);
  },500);

const faceRight=()=>{S.face=1;const f=$('#catFlip');f&&f.setAttribute('transform','scale(1,1)')};
function batYarn(){
  if(S.yarn==='tangled'){unTangle();return}
  faceRight();
  if(S.yarn==='done'){react('happy');say('The yarn is all unrolled. What a mess! Poooourrr!');return}
  const n=S.yarn,b=$('.yarnb');S.busy=true;clearTimeout(moodT);setMood('push');sfx.roll();
  if(n<2){
    S.yarn=n+1;b&&(b.style.transform=`translate(${YARNX[n+1]}px,${490-YARNR[n+1]}px) rotate(${(n+1)*200}deg)`);
    later(()=>{S.busy=false;S.mood='normal';render()},650);
    say(n===0?'Bat! The yarn rolls away!':'Bat bat! It unrolls more and more!');
  }else{
    // the last bat: the yarn rolls away and back, round and round the cat
    b&&(b.style.transform=`translate(340px,479px) rotate(700deg)`);
    later(()=>{b&&(b.style.transform=`translate(${S.x+48}px,481px) rotate(1100deg)`);const an=$('#catAnim');an&&restartClass(an,'jump',700)},500);
    later(()=>{S.yarn='tangled';S.busy=false;S.mood='scared';render();sfx.boing();bubble(S.x,headY(),'TANGLED!','#e0508a');
      say('Oh no! You are all tangled up. Like a pink present!');moodT=setTimeout(()=>setMood('normal'),1600)},1100);
    say('Bat bat bat! The yarn rolls round and round…','');
  }
}

function popBubble(i){
  if(S.pops.includes(i)||S.bath!=='in')return;
  S.pops.push(i);const [x,y]=BUBS[i];sfx.pop();render();
  burst(x,y,(bx,by,j)=>`<circle cx="${bx}" cy="${by}" r="${3+j%3}" fill="#eaf7ff" stroke="#7cc6f0" stroke-width="1.5"/>`);
  bubble(x,y-30,'POP!','#2c8fd6');
  const left=BUBS.length-S.pops.length;
  if(left){say(left===1?'Pop! One more bubble!':`Pop! ${left} more bubbles.`);return}
  S.busy=true;say('Pop! No more bubbles. You jump out…','');
  later(()=>{
    S.bath='shake';S.x=230;S.face=1;S.mood='normal';clearBubbles();render();
    const an=$('#catAnim');an&&restartClass(an,'wetshake',900);
    sfx.shake();wetScreen();restartClass(document.querySelector('.frame'),'shake',900);
    bubble(S.x,headY(),'SHAKE SHAKE!','#2c8fd6');
    say('Shake shake shake! Now everything is wet! Miaawow!','');
  },500);
  later(()=>{S.bath='done';S.busy=false;render();react('happy');say('All clean and fluffy! Poooourrr!')},2400);
}

    const got=S.today+NAPPTS;S.points+=NAPPTS;S.today=0;S.done=[];
    S.awake=false;S.tummy=0;S.fridge=false;S.bowl=0;S.fish=false;S.mood='sleep';S.stars=[];S.wink=false;S.box='door';S.cup=0;

/* ---------- effects ---------- */
function bubble(x,y,text,color){
  x=Math.max(92,Math.min(308,x));const id='b'+(++uid),rx=Math.round(text.length*7.6+20);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" class="bubble" pointer-events="none">
    <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="28" fill="#fff" ${K}/>
    <path d="M${x-10},${y+24} L${x-20},${y+44} L${x+8},${y+25}" fill="#fff" ${K}/>
    <path d="M${x-12},${y+23} L${x+10},${y+23}" stroke="#fff" stroke-width="5"/>
    <text x="${x}" y="${y+9}" text-anchor="middle" class="say" fill="${color}">${text}</text></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1700);
}
function stickerPop(i){
  const id='p'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none" transform="translate(200,150)"><g class="stkpop"><g transform="scale(1.7)">${stkSVG(i)}</g>
    <text y="80" text-anchor="middle" class="say" fill="#e0508a" stroke="#fff" stroke-width="5" paint-order="stroke">NEW STICKER!</text></g></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},2400);
}
function splash(x,y){
  const id='s'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none"><g class="floaty">${[-30,-12,12,30].map((dx,i)=>`<circle cx="${x+dx}" cy="${y-8-(i%2)*10}" r="5" fill="#7cb6e6" stroke="${INK}" stroke-width="1.5"/>`).join('')}</g></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1600);
}
// leaves or petals that fly up and fade
function burst(x,y,art){
  const id='u'+(++uid);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none"><g class="floaty">${[-34,-20,-6,8,22,34].map((dx,i)=>art(x+dx,y-(i%3)*12,i)).join('')}</g></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1600);
}
function floatPts(n){
  const id='q'+(++uid),x=Math.max(70,Math.min(330,S.x+(S.x>200?-70:70))),y=Math.max(90,headY()+10);
  stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none"><g class="floaty" style="animation-duration:1.9s"><text x="${x}" y="${y}" text-anchor="middle" class="say" fill="#ffd34d" stroke="${INK}" stroke-width="1.4">+${n} ★</text></g></g>`);
  setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},2000);
}
function hearts(x,y){
  for(let i=0;i<3;i++){
    const id='h'+(++uid),hx=x+(i-1)*24;
    stage.insertAdjacentHTML('beforeend',`<g id="${id}" pointer-events="none"><g class="floaty" style="animation-delay:${i*.15}s">${heart(hx,y-i*6,1.1,'#e0508a')}</g></g>`);
    setTimeout(()=>{const e=document.getElementById(id);e&&e.remove()},1900);
  }
}
function say(story,hint){
  document.getElementById('story').textContent=story;
  document.getElementById('hint').textContent=hint===undefined?SC[S.scene].goal().hint:hint;
  refreshGoal();checkFun();save();
}
function updateHud(){
  document.getElementById('hearts').textContent=S.hearts;
  document.getElementById('pts').textContent=S.points;
  document.getElementById('tummy').innerHTML=[0,1,2].map(i=>`<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M7,1 C7,1 1,8 1,11 a6,5 0 0 0 12,0 C13,8 7,1 7,1Z" fill="${i<S.tummy?'#fff':'#d7ecfa'}" stroke="#1d1a1f" stroke-width="1.6"/></svg>`).join('');
  document.getElementById('tummyChip').setAttribute('aria-label',`Tummy ${S.tummy} of 3`);
}

/* ---------- sound ---------- */
let AC=null;
function ac(){
  if(!S.sound)return null;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}
  return AC;
}
function seq(type,notes){
  const a=ac();if(!a)return;let t=a.currentTime;
  notes.forEach(([f1,f2,d,v])=>{
    const o=a.createOscillator(),g=a.createGain();o.type=type;
    o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);t+=d+.07;
  });
}
const sfx={
  meow(scared){
    const a=ac();if(!a)return;const t=a.currentTime,d=scared?.8:.6,base=scared?650:480;
    const o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
    o.type='sawtooth';f.type='bandpass';f.frequency.value=scared?1400:1000;f.Q.value=2;
    o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.6,t+d*.35);o.frequency.linearRampToValueAtTime(base*.8,t+d);
    if(scared){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=14;lg.gain.value=45;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+d)}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(scared?.4:.28,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
  },
  purr(){
    const a=ac();if(!a)return;const t=a.currentTime,d=1.4,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
    const g=a.createGain();g.gain.value=.5;const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=24;lg.gain.value=.5;lfo.connect(lg).connect(g.gain);
    const env=a.createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(1.2,t+.2);env.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(env).connect(a.destination);s.start(t);lfo.start(t);s.stop(t+d);lfo.stop(t+d);
  },
  woof(){seq('square',[[260,140,.18,.15],[260,140,.18,.15]])},
  beep(){seq('square',[[520,520,.15,.08],[520,520,.15,.08]])},
  bzz(){seq('sawtooth',[[110,150,.9,.1]])},
  rumble(){seq('sine',[[80,50,.4,.5],[70,45,.5,.5]])},
  slurp(){seq('sine',[[300,700,.12,.15],[300,700,.12,.15]])},
  coin(){seq('triangle',[[660,660,.1,.14],[990,990,.22,.14]])},
  pounce(){seq('sine',[[220,620,.14,.2]])},
  boing(){seq('sine',[[200,520,.15,.2],[520,300,.2,.15]])},
  scrape(){seq('sawtooth',[[95,75,.28,.05]])},
  crash(){
    const a=ac();if(!a)return;const t=a.currentTime,d=.7,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1200;
    const g=a.createGain();g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
    seq('triangle',[[2100,2100,.05,.08],[2700,2700,.05,.06],[1900,1900,.07,.05]]);
  },
  sticker(){seq('triangle',[[523,523,.1,.12],[659,659,.1,.12],[784,784,.22,.12]])},
  stick(){seq('sine',[[300,900,.08,.22]])},
  twinkle(n){const f=[523,587,659,784,880][Math.min(n,5)-1];seq('triangle',[[f,f,.12,.12],[f*2,f*2,.2,.08]])},
  note(i){
    const a=ac();if(!a)return;const t=a.currentTime,f=NOTE[i];
    [[f,'triangle',.28],[f*2,'sine',.06]].forEach(([fr,ty,v])=>{
      const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=fr;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.7);
      o.connect(g).connect(a.destination);o.start(t);o.stop(t+.75);
    });
  },
  chord(){[0,2,4,7].forEach(i=>this.note(i))},
  crunch(soft){
    const a=ac();if(!a)return;const t=a.currentTime,len=Math.floor(a.sampleRate*.5);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);
    // three little crackly bursts
    for(let i=0;i<len;i++){const k=(i/len*3)%1;ch[i]=(Math.random()*2-1)*Math.max(0,1-k*2.2)}
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=soft?700:2200;f.Q.value=.8;
    const g=a.createGain();g.gain.value=soft?.5:.35;s.connect(f).connect(g).connect(a.destination);s.start(t);
  },
  achoo(){
    seq('sine',[[500,820,.32,.12]]);
    const a=ac();if(!a)return;const t=a.currentTime+.42,d=.35,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1500;
    const g=a.createGain();g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
  },
  noise(d,type,fr,v){
    const a=ac();if(!a)return;const t=a.currentTime,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=fr;
    const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
  },
  pop(){seq('sine',[[600,1400,.07,.22]])},
  squeak(){seq('square',[[1300,1700,.09,.05],[1400,1800,.09,.05]])},
  quack(){seq('sawtooth',[[420,300,.12,.12],[400,270,.15,.12]])},
  chatter(){seq('square',[[1200,900,.04,.05],[1200,900,.04,.05],[1200,900,.04,.05]])},
  chirp(i){const f=NOTE[i]*2;seq('triangle',[[f*1.15,f,.07,.12],[f,f*1.05,.2,.1]])},
  whoosh(){this.noise(.6,'lowpass',900,.5)},
  shake(){this.noise(.9,'bandpass',500,.45)},
  roll(){seq('sine',[[180,120,.3,.15]])},
  plop(){seq('sine',[[500,180,.12,.18]])},
  splash(){
    const a=ac();if(!a)return;const t=a.currentTime,d=.45,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(400,t+d);
    const g=a.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
  }
};

/* ---------- input ---------- */
function activate(el){
  if(!el||S.busy)return;
  ac();
  const h=HOTS[el.dataset.id];if(!h)return;
  const tx=typeof h.walk==='function'?h.walk():h.walk;
  if(tx!==undefined&&$('#cat')) walkTo(Math.max(40,Math.min(360,tx)),h.tap);
  else h.tap();
}
let TAP=null;
stage.addEventListener('click',e=>{
  const m=stage.getScreenCTM();
  TAP=m?new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()):null;
  activate(e.target.closest('.hot'));
});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest&&e.target.closest('.hot');if(el){e.preventDefault();TAP=null;activate(el)}}});

/* ---------- players, saves and the top cats ---------- */
const ov=document.getElementById('ov');
const NAMES=['LUNA','MIMI','TIGER','PEACH','SOCKS','COOKIE','MOCHI','BEAN'];
const MAXCATS=8;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const miniCat=(s,m='normal')=>`<svg class="mini" viewBox="-56 -196 112 202" aria-hidden="true">${catSVG(m,false,false,PINK,s?{hat:s.hat,bow:s.bow,glasses:s.glasses}:{})}</svg>`;
const TROPHY=`<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M6,5 H3 Q3,11 8,11 M18,5 H21 Q21,11 16,11" fill="none" stroke="${INK}" stroke-width="2"/><path d="M6,3 H18 V8 A6,6 0 0 1 6,8Z" fill="#ffd34d" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M12,14 V18" stroke="${INK}" stroke-width="2.4"/><rect x="7" y="18" width="10" height="4" rx="1" fill="#e0508a" stroke="${INK}" stroke-width="2"/></svg>`;
const metaOf=c=>c.s?`DAY ${c.s.day||1} · ★ ${c.s.points||0}`:'NEW!';
let ovKind='';
function openOv(kind,html,story,hint){
  ovKind=kind;ov.innerHTML=html;ov.hidden=false;ov.scrollTop=0;
  document.getElementById('story').textContent=story;document.getElementById('hint').textContent=hint||'';
  const f=ov.querySelector('[data-focus]');f&&f.focus({preventScroll:true});
}
function closeOv(){ov.hidden=true;ov.innerHTML='';ovKind=''}
function showTitle(){
  if(!DB.cats.length){showName();return}
  const cats=[...DB.cats].sort((a,b)=>(b.at||0)-(a.at||0));
  openOv('title',`<h2>Who is playing?</h2>
    <div class="row">${DB.cats.length<MAXCATS?`<button class="big small green" data-a="new">+ NEW CAT</button>`:''}<button class="big small gold" data-a="board">${TROPHY} TOP CATS</button></div>
    <div class="cats">${cats.map(c=>`<div class="card"><button class="big pick${c.id===CUR?' pink':''}" data-a="play" data-id="${esc(c.id)}">${miniCat(c.s)}<span><span class="nm">${esc(c.name)}</span><span class="meta">${metaOf(c)}</span></span></button>
      <button class="x" data-a="del" data-id="${esc(c.id)}" aria-label="Say bye-bye to ${esc(c.name)}">×</button></div>`).join('')}</div>
`,
    'Who is playing today?','Tap your cat to keep playing');
}
function showName(){
  const pick=NAMES.filter(n=>!DB.cats.some(c=>c.name===n));
  const first=pick[0]||NAMES[0];
  openOv('name',`<h2>Your cat's name?</h2>
    <svg viewBox="-60 -196 120 202" width="60" height="96" style="align-self:center" aria-hidden="true">${catSVG('happy')}</svg>
    <input id="nameIn" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Cat name" value="${first}">
    <button class="big pink" data-a="go" data-focus>GO! ▶</button>
    <div class="sugg">${(pick.length?pick:NAMES).slice(0,6).map(n=>`<button data-a="sugg" data-n="${n}">${n}</button>`).join('')}</div>
    ${DB.cats.length?`<button class="big small" data-a="title">← BACK</button>`:''}`,
    'You are a cat! What is your name?','Tap a name, or type one. Then tap GO!');
}
function showMenu(){
  const c=curCat();if(!c){showTitle();return}
  save();if(ov.hidden)PREV=[document.getElementById('story').textContent,document.getElementById('hint').textContent];
  openOv('menu',`<div class="menuTop">${miniCat(S,'happy')}<div><h2>${esc(c.name)}</h2><p>DAY ${S.day} · ★ ${S.points}</p></div>
      <button class="snd" data-a="snd" aria-pressed="${S.sound}">${S.sound?'♪ ON':'♪ OFF'}</button></div>
    <button class="big pink" data-a="close" data-focus>▶ KEEP PLAYING</button>
    <button class="big blue" data-a="save" id="saveBtn">✓ SAVE</button>
    <button class="big green" data-a="again">↺ START AGAIN</button>
    <button class="big gold" data-a="board">${TROPHY} TOP CATS</button>
    <button class="big" data-a="title">CHANGE CAT</button>`,
    'Paws! The game is waiting for you.','');
}
function showBoard(){
  const cats=[...DB.cats].sort((a,b)=>score(b)-score(a));
  const MED=['#ffd34d','#d3d4dc','#e09a78'];
  openOv('board',`<h2>${TROPHY} Top cats</h2>
    <div class="board">${cats.map((c,i)=>`<div class="rank${c.id===CUR?' me':''}"><span class="medal" style="${i<3?`background:${MED[i]}`:''}">${i+1}</span>
      ${miniCat(c.s)}<span class="nm">${esc(c.name)}<span class="meta">DAY ${c.s&&c.s.day||1}</span></span><span class="score"><span class="star">★</span> ${score(c)}</span></div>`).join('')}</div>
    <button class="big pink" data-a="${ovKind==='menu'?'menu':'title'}" data-focus>← BACK</button>`,
    cats.length?`${cats[0].name} is the top cat!`:'No cats yet!','Points come from hearts, fun things and naps');
}
function confirmBox(q,sub,yes,no){
  openOv('confirm',`${miniCat(null,'scared').replace('class="mini"','class="mini" style="align-self:center"')}
    <h2>${q}</h2><p>${sub}</p>
    <button class="big pink" data-a="no" data-focus>NO, KEEP IT!</button>
    <button class="big small" data-a="yes">YES</button>`,q,'');
  CONFIRM={yes,no};
}
let CONFIRM=null, PREV=null;
// back to the game: the story and hint come back as they were
function resume(){closeOv();if(PREV){document.getElementById('story').textContent=PREV[0];document.getElementById('hint').textContent=PREV[1]}refreshGoal()}
// a fresh start for this cat or a different cat: stop whatever the last one was doing
function reset(){GEN++;clearLater();clearBubbles();S.busy=false;stage.classList.remove('fade')}
function startCat(c){
  reset();CUR=c.id;loadState(c.s);closeOv();
  const w=document.getElementById('who'),mb=document.getElementById('menuBtn');w.textContent=c.name;mb.hidden=false;mb.setAttribute('aria-label',`Menu for ${c.name}`);
  if(!S.awake){render();updateHud();say(c.s?`Welcome back, ${c.name}! You are asleep.`:`You are a cat called ${c.name}. You are asleep.`)}
  else{render();updateHud();go(S.scene,200);later(()=>{const s=document.getElementById('story');s.textContent=`Welcome back, ${c.name}! `+s.textContent},360)}
}
function newCat(name){
  const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,best:0,at:Date.now(),s:null};
  DB.cats.push(c);startCat(c);
}
function startAgain(){
  const c=curCat();if(!c)return;
  c.best=Math.max(c.best||0,S.points);reset();loadState(null);closeOv();render();updateHud();
  say(`A brand new start, ${c.name}! Day 1. You are asleep.`);
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  ac();const a=b.dataset.a,id=b.dataset.id;
  if(a==='play'){const c=DB.cats.find(c=>c.id===id);c&&startCat(c)}
  else if(a==='new') showName();
  else if(a==='title') showTitle();
  else if(a==='board') showBoard();
  else if(a==='menu') showMenu();
  else if(a==='close') resume();
  else if(a==='sugg'){const i=document.getElementById('nameIn');i.value=b.dataset.n;sfx.twinkle(2)}
  else if(a==='go'){
    const v=(document.getElementById('nameIn').value||'').trim().toUpperCase().replace(/\s+/g,' ').slice(0,10);
    sfx.sticker();newCat(v||NAMES[0]);
  }
  else if(a==='snd'){S.sound=!S.sound;b.textContent=S.sound?'♪ ON':'♪ OFF';b.setAttribute('aria-pressed',S.sound);try{localStorage.setItem(SAVE+'-sound',S.sound?'1':'0')}catch(e){}}
  else if(a==='save'){save();sfx.coin();b.innerHTML='✓ SAVED!';restartClass(b,'bump',500)}
  else if(a==='again') confirmBox('Start again from day 1?','Your hearts, points and stickers start over.',startAgain,showMenu);
  else if(a==='del'){const c=DB.cats.find(c=>c.id===id);c&&confirmBox(`Say bye-bye to ${esc(c.name)}?`,'This cat goes away for good.',()=>{
    DB.cats=DB.cats.filter(x=>x.id!==id);store();
    if(CUR===id){CUR=null;reset();document.getElementById('menuBtn').hidden=true;loadState(null);render();updateHud()}
    showTitle()},showTitle)}
  else if(a==='yes'){const f=CONFIRM&&CONFIRM.yes;CONFIRM=null;f&&f()}
  else if(a==='no'){const f=CONFIRM&&CONFIRM.no;CONFIRM=null;f&&f()}
});
ov.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nameIn'){e.preventDefault();ov.querySelector('[data-a="go"]').click()}});
document.getElementById('menuBtn').addEventListener('click',()=>{ac();ov.hidden?showMenu():CUR?resume():0});
// saving when the page goes away too, in case the last tap did not tell a story
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>document.visibilityState==='hidden'&&save());

render();updateHud();showTitle();
</script>
