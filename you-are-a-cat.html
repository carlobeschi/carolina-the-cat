<title>You Are a Cat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Layout: Carolina's crayon-blue dotted frame holds a tap-to-play stage; the story sits below in blue-pen capitals like her note */
:root{
  --sky:#2c8fd6; --sky-dot:#7cc6f0; --sky-soft:#d7ecfa; --paper:#fffaf6; --ink:#1d1a1f;
  --pen:#1f5fa8; --pink:#f3a3c6; --hot:#e0508a; --gold:#d6ad45;
  /* from Carolina's paintings: sticker-dot red and orange, caterpillar green, the mint table */
  --red:#d8243c; --orange:#f5891f; --green:#1f8a4c; --mint:#cdeee2;
  --display:"Gochi Hand","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
}
html,body{background:var(--sky-soft);color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
/* tablets and laptops: grow or shrink the stage (400x520) so the header, stage and story all fit on screen */
@media (min-width:600px){.wrap{max-width:clamp(340px,calc((100vh - 250px) / 1.3),700px);max-width:clamp(340px,calc((100dvh - 250px) / 1.3),700px)}}
@media (min-width:600px) and (min-height:1000px){header,.story,.ov{zoom:1.25}.wrap{max-width:clamp(340px,calc((100vh - 300px) / 1.3),700px);max-width:clamp(340px,calc((100dvh - 300px) / 1.3),700px)}}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,7vw,1.8rem);margin:0;line-height:1;color:var(--hot);text-wrap:balance}
.by{font-size:1rem;color:var(--pen);margin-top:2px}
/* a few of Carolina's sticker dots after her name */
.by::after{content:"";display:inline-block;vertical-align:middle;margin-left:6px;width:44px;height:12px;background:radial-gradient(circle at 6px 6px,var(--red) 5px,transparent 5.5px),radial-gradient(circle at 22px 6px,var(--orange) 5px,transparent 5.5px),radial-gradient(circle at 38px 6px,var(--green) 5px,transparent 5.5px)}
.hud{order:3;width:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:1.05rem;display:flex;align-items:center;gap:5px;color:var(--ink);font-family:var(--body);line-height:1.4;font-variant-numeric:tabular-nums}
button.chip{cursor:pointer}
.chip[hidden]{display:none}
#menuBtn{font-family:var(--display);font-size:1.3rem;margin-top:4px;max-width:46%;overflow:hidden;white-space:nowrap}
button.chip:focus-visible{outline:3px dashed var(--hot);outline-offset:2px}
.frame{background:var(--sky);background-image:radial-gradient(circle,var(--sky-dot) 0 5px,transparent 6px);background-size:56px 56px;padding:8px;border-radius:6px;border:2.5px solid var(--ink)}
#stage{display:block;width:100%;height:auto;background:var(--paper);border-radius:14px;border:2.5px solid var(--ink);touch-action:manipulation;transition:opacity .3s;-webkit-tap-highlight-color:transparent;user-select:none}
#stage.fade{opacity:0}
.story{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;color:var(--pen);min-height:4.4em}
#story{font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.35;margin:0}
#hint{font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--hot);margin:6px 0 0}

/* svg bits */
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible{outline:3px dashed var(--hot)}
.lbl{font-family:var(--display);font-size:17px;fill:var(--pen);stroke:#fff;stroke-width:4px;paint-order:stroke;letter-spacing:.04em}
.say{font-family:var(--display);font-size:27px;letter-spacing:.03em}
.sign{font-family:var(--display);font-size:26px;fill:var(--pen)}
#catAnim,#palAnim{transform-box:fill-box;transform-origin:50% 100%}
.walk{animation:walk .32s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(-3deg)}75%{transform:translateY(-5px) rotate(3deg)}}
.jump{animation:jump .7s ease-out}
@keyframes jump{0%{transform:none}30%{transform:translateY(-70px) scale(.9,1.12)}60%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
.wiggle{animation:wiggle .9s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.stretch{animation:stretch .9s ease-in-out}
@keyframes stretch{0%,100%{transform:none}40%{transform:scale(1.15,.85)}70%{transform:scale(.92,1.12)}}
.breathe{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05,1)}}
.zzz text{font-family:var(--display);fill:var(--sky);font-size:30px;animation:zz 2.4s ease-out infinite;transform-box:fill-box}
.zzz text:nth-child(2){animation-delay:.6s;font-size:24px}
.zzz text:nth-child(3){animation-delay:1.2s;font-size:20px}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(12px,-22px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
.floaty{animation:floaty 1.5s ease-out both;transform-box:fill-box}
@keyframes floaty{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-80px);opacity:0}}
.bubble{animation:pop .25s ease-out;transform-box:fill-box;transform-origin:center bottom}
@keyframes pop{0%{transform:scale(.3)}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .9s linear;transform-box:fill-box}
@keyframes shake{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:translate(-3px,1px)}20%,40%,60%,80%{transform:translate(3px,-1px)}}
.drive{animation:drive 2.2s ease-in-out}
@keyframes drive{0%{transform:translateX(0)}40%{transform:translateX(200px)}41%{transform:translateX(-420px)}100%{transform:translateX(0)}}
.flap{animation:flap .35s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flap{50%{transform:scaleX(.35)}}
.bfly{transition:transform 1s ease-in-out}
.dot{transition:transform .35s cubic-bezier(.5,0,.2,1),opacity .3s}
.dot.gone{opacity:0;pointer-events:none}
.jit{animation:jit .5s steps(2) infinite}
@keyframes jit{50%{transform:translate(1.5px,-1px)}}
.rainfall{animation:fall .9s linear infinite}
@keyframes fall{to{transform:translateY(520px)}}
.ripple{animation:ripple 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.2);opacity:0}}
/* a new sticker pops up big, waits a moment, then fades away */
.stkpop{animation:stkpop 2.3s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes stkpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}15%{transform:scale(1.15) rotate(4deg);opacity:1}25%{transform:scale(1) rotate(0)}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30px)}}
/* Carolina's painting swings a little when the cat looks at it */
.swing{animation:wiggle .9s ease-in-out;transform-box:fill-box;transform-origin:50% 0}
/* the shy grey cat ducks behind the wall */
.duck{animation:duck 1.5s ease-in-out}
/* the cup wobbles from its bottom when the cat pushes it */
.cupw{transform-box:fill-box;transform-origin:50% 100%}
@keyframes duck{0%,100%{transform:none}25%,70%{transform:translateY(75px)}}
/* snow and autumn leaves drift down slower than rain */
.snowfall{animation:fall 9s linear infinite}
.leaffall{animation:fall 11s linear infinite}
/* a piano key dips when a paw lands on it; the cat dances when it plays the song */
.press{animation:press .3s ease-out}
@keyframes press{40%{transform:translateY(6px)}}
.dance{animation:dance .45s ease-in-out 4}
@keyframes dance{0%,100%{transform:none}25%{transform:translateY(-16px) rotate(-11deg)}50%{transform:scale(1.07,.93)}75%{transform:translateY(-16px) rotate(11deg)}}
/* bath: drops all over the screen when the wet cat shakes; bubbles bob in the air */
.drip{animation:drip 2.6s ease-in both;transform-box:fill-box;transform-origin:center}
@keyframes drip{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.1);opacity:1}30%{transform:scale(1)}100%{transform:translateY(70px);opacity:0}}
.wetshake{animation:wetshake .9s linear}
@keyframes wetshake{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:rotate(-9deg)}20%,40%,60%,80%{transform:rotate(9deg)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-8px)}}
/* the yarn ball rolls when you bat it */
.yarnb{transition:transform .6s ease-out}
/* park: ducks paddle, fish leap out of the pond in an arc */
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.leapx{animation:leapx 1.1s linear both}
@keyframes leapx{to{transform:translateX(80px)}}
.leapy{animation:leapy 1.1s both}
@keyframes leapy{0%{transform:none;animation-timing-function:ease-out}50%{transform:translateY(-95px);animation-timing-function:ease-in}100%{transform:none}}
.leapr{animation:leapr 1.1s linear both}
@keyframes leapr{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
/* players, the pause menu and the top cats board sit on paper over the stage */
.frame{position:relative}
.ov{position:absolute;inset:8px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;overflow:auto;padding:clamp(8px,3vw,14px) clamp(8px,3vw,14px) 16px;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center;font-family:var(--display);color:var(--pen)}
.ov[hidden]{display:none}
.ov>*{flex:none}
.ov input{box-sizing:border-box}
.menuTop{display:flex;align-items:center;gap:12px;text-align:left}
.menuTop>div{flex:1;min-width:0}
.menuTop h2{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menuTop p{white-space:nowrap}
.menuTop .snd{border:2.5px solid var(--ink);border-radius:999px;background:#fff;font-size:1.1rem;padding:4px 10px;min-height:44px;white-space:nowrap}
.ov h2{font-family:var(--display);font-weight:400;font-size:clamp(1.45rem,7vw,1.9rem);line-height:1.05;margin:4px 0 0;color:var(--hot);text-wrap:balance}
.ov p{margin:0;font-size:clamp(1rem,4.6vw,1.25rem);letter-spacing:.04em;text-transform:uppercase}
.ov button{font-family:var(--display);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ov button:focus-visible,.ov input:focus-visible{outline:3px dashed var(--hot);outline-offset:2px}
.big{min-height:54px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;font-size:clamp(1.2rem,6vw,1.6rem);letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 10px;box-shadow:0 4px 0 var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big.pink{background:var(--pink)}.big.blue{background:#9fd0ef}.big.gold{background:#ffd98a}.big.green{background:#c9e6a8}
.big.small{min-height:46px;font-size:clamp(1rem,4.6vw,1.25rem)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.row .big{white-space:normal;line-height:1.1}
.cats{display:flex;flex-direction:column;gap:10px}
.card{position:relative;display:flex}
.card .pick{flex:1;min-width:0;justify-content:flex-start;text-align:left;padding-right:50px}
.card .pick>span{min-width:0}
.card .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);font-size:1.5rem;line-height:1;color:var(--ink)}
.mini{width:clamp(38px,12vw,52px);height:clamp(48px,15vw,64px);flex:none}
.nm{display:block;font-size:clamp(1.3rem,6vw,1.7rem);line-height:1;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;white-space:nowrap;font-size:1.05rem;color:var(--pen);font-family:var(--body);letter-spacing:.05em}
.ov input{font-family:var(--display);font-size:1.8rem;text-align:center;text-transform:uppercase;letter-spacing:.06em;border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;background:#fff;color:var(--hot);width:100%;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugg button{border:2.5px solid var(--ink);border-radius:999px;background:var(--sky-soft);font-size:1.2rem;padding:2px 12px;min-height:44px}
.board{display:flex;flex-direction:column;gap:8px}
.rank{display:flex;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:16px;padding:4px 12px;background:#fff;text-align:left}
.rank.me{background:#fde6ee}
.medal{width:34px;height:34px;flex:none;border-radius:50%;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--ink);background:var(--paper)}
.rank .nm{flex:1;min-width:0;font-size:clamp(1.2rem,5.5vw,1.5rem)}
.rank{padding:4px 8px;gap:8px}
.score{font-size:clamp(1.2rem,5.5vw,1.6rem);color:var(--ink);white-space:nowrap}
.star{color:var(--gold);-webkit-text-stroke:1px var(--ink)}
.bump{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
.big.orange{background:#f9b36b}
/* parties: the crayon frame changes colour for each one */
[data-theme=halloween]{--sky:#5b3a8c;--sky-dot:#f5891f;--sky-soft:#efe4f7}
[data-theme=halloween] h1{color:#e8742a}
[data-theme=christmas]{--sky:#1f8a4c;--sky-dot:#d8243c;--sky-soft:#e3f3e6}
[data-theme=christmas] h1{color:#d8243c}
[data-theme=easter]{--sky:#b493e6;--sky-dot:#ffe680;--sky-soft:#fdf0f6}
[data-theme=carnival]{--sky-soft:#fff3d6}
[data-theme=carnival] .frame{background-image:radial-gradient(circle,#ffd34d 0 5px,transparent 6px),radial-gradient(circle,#f38db5 0 5px,transparent 6px);background-position:0 0,28px 28px}
[data-theme=lunar]{--sky:#c8102e;--sky-dot:#ffd34d;--sky-soft:#fde8e4}
[data-theme=lunar] h1{color:#c8102e}
/* the party picker: a row of round party buttons */
.parties{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.parties button{width:44px;height:44px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.parties button[aria-pressed=true]{background:var(--pink);box-shadow:0 0 0 3px var(--hot)}
.partyName{color:var(--hot)}
.big.party{justify-content:flex-start}
.big.party[aria-pressed=true]{background:var(--pink)}
/* playground: the swing swings from its top bar, the seesaw rocks on its middle */
.swingy{animation:swingy 1.2s ease-in-out 3}
@keyframes swingy{25%{transform:rotate(-28deg)}75%{transform:rotate(28deg)}}
.teeter{animation:teeter 1.1s ease-in-out 3}
@keyframes teeter{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
/* cat school: chalk on the blackboard */
.chalk{font-family:var(--display);fill:#fff;letter-spacing:.05em}
/* town square: the pigeons fly off when the cat pounces, then come back */
.flyoff{animation:flyoff 2.4s ease-in-out}
@keyframes flyoff{0%{transform:none;opacity:1}35%{transform:translate(-40px,-230px);opacity:0}65%{transform:translate(40px,-230px);opacity:0}100%{transform:none;opacity:1}}
/* holidays: a goal in Brazil, and the hills going by the sleeper train window */
.kick{animation:kick 1.5s ease-out}
@keyframes kick{0%{transform:none}40%{transform:translate(94px,-48px) rotate(300deg)}60%{transform:translate(96px,-8px) rotate(400deg)}85%{transform:translate(96px,-8px) rotate(400deg);opacity:1}92%{opacity:0}100%{transform:none;opacity:1}}
.drift{animation:drift 4s linear infinite}
@keyframes drift{to{transform:translateX(-140px)}}
@media (prefers-reduced-motion:reduce){
  .walk,.pulse,.breathe,.flap,.zzz text,.jit,.rainfall,.ripple,.snowfall,.leaffall,.bob,.swim,.drift{animation:none}
  .bump,.jump,.wiggle,.stretch,.shake,.drive,.stkpop,.duck,.press,.dance,.drip,.wetshake,.leapx,.leapy,.leapr,.swingy,.teeter,.flyoff,.kick{animation-duration:.01s}
}
</style>

// Easter Sunday for a year (the usual church calendar sum)
function easterDay(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31);
  return new Date(y,mo-1,(h+l-7*m+114)%31+1);
}
// the first day of the Lunar New Year, as [month, day], for the years this game is likely to see
const LUNAR={2026:[2,17],2027:[2,6],2028:[1,26],2029:[2,13],2030:[2,3],2031:[1,23],2032:[2,11],2033:[1,31],2034:[2,19],2035:[2,8]};
function autoParty(d=new Date()){
  const y=d.getFullYear(),m=d.getMonth()+1,n=d.getDate(),day=t=>Math.round((new Date(y,m-1,n)-t)/864e5);
  if((m===10&&n>=15)||(m===11&&n<=2)) return 'halloween';
  if(m===12||(m===1&&n<=6)) return 'christmas';
  const ea=day(easterDay(y));
  if(ea>=-14&&ea<=7) return 'easter';
  // carnival is the twelve days up to the Tuesday before Lent
  if(ea>=-58&&ea<=-47) return 'carnival';
  const ln=LUNAR[y];
  if(ln){const l=day(new Date(y,ln[0]-1,ln[1]));if(l>=-3&&l<=14) return 'lunar'}
  return 'none';
}

function cloud(cx,cy,rx,ry,n){
  let d='';
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2, x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    if(i===0){d+=`M${x.toFixed(1)},${y.toFixed(1)}`}
    else{const m=(i-.5)/n*Math.PI*2;d+=`Q${(cx+rx*1.3*Math.cos(m)).toFixed(1)},${(cy+ry*1.3*Math.sin(m)).toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`}
  }
  return d+'Z';
}

/* ---------- Carolina's art ---------- */
// each photo is 100 wide in the hidden art svg; h keeps its shape
const ART={
  vase:{h:120,frame:'#d6ad45',label:"Carolina's painting of flowers",
    story:'A painting by Carolina! Red flowers in a gold vase, and smiling hearts all around.'},
  cupcake:{h:120,frame:'#3a63c9',label:"Carolina's cupcake painting",
    story:'A painting by Carolina! A big pink cupcake with sprinkles. Yum yum!'},
  dots:{h:74,label:"Carolina's sticker picture",
    story:'A picture by Carolina! Red and orange dots, a green caterpillar and smiley faces. It says love!'}
};
const artUse=(k,x,y,w)=>`<use href="#art-${k}" transform="translate(${x},${y}) scale(${w/100})"/><rect x="${x}" y="${y}" width="${w}" height="${(ART[k].h*w/100).toFixed(1)}" fill="none" stroke="${INK}" stroke-width="2"/>`;
// a painting in a thick frame, with white dots on the frame like the ones Carolina paints
function framed(k,x,y,w){
  const a=ART[k],h=a.h*w/100,b=Math.max(6,Math.round(w*.08)),r=Math.max(1.5,b/4);
  const dots=[[x-b/2,y-b/2],[x+w+b/2,y-b/2],[x-b/2,y+h+b/2],[x+w+b/2,y+h+b/2],[x+w/2,y-b/2],[x+w/2,y+h+b/2]];
  return `<rect x="${x-b}" y="${y-b}" width="${w+2*b}" height="${(h+2*b).toFixed(1)}" rx="${b/2}" fill="${a.frame}" ${K}/>${artUse(k,x,y,w)}
  ${dots.map(([cx,cy])=>`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="#fff"/>`).join('')}`;
}
// the sticker picture is taped to the fridge door
function taped(x,y,w){
  const h=ART.dots.h*w/100,t=w*.22;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h.toFixed(1)}" fill="#fff"/>${artUse('dots',x,y,w)}
  <rect x="${-t/2}" y="-5" width="${t}" height="10" fill="#f3e3b0" opacity=".85" transform="translate(${x+8},${y+2}) rotate(-30)"/>
  <rect x="${-t/2}" y="-5" width="${t}" height="10" fill="#f3e3b0" opacity=".85" transform="translate(${x+w-8},${y+2}) rotate(30)"/>`;
}
// tapping a painting goes up close to it; the back arrow returns to where the cat stood

  // walking onto the key already played it, so only play it again if that was a while ago
  if(!(S.lastNote===i&&performance.now()-S.noteT<400)) playKey(i);
  const song=curSong();
  bubble(KEY0+i*KEYW+KEYW/2,292,SOLFA[i]+'!',KEYC[i]);
  if(i!==song[S.songAt]){say(`${SOLFA[i][0]+SOLFA[i].slice(1).toLowerCase()}! Your paw plays a note.`);return}
  S.songAt++;const sh=$('#sheet');sh&&(sh.innerHTML=sheet());

  S.busy=true;S.danced=true;
  const song=curSong(),fromBird=S.bird==='sang';
  song.forEach((k,j)=>later(()=>{playKey(k);fromBird&&sfx.chirp(k)},300+j*240));
  later(()=>sfx.chord(),300+song.length*240);
  setMood('happy');const an=$('#catAnim'),pa=$('#palAnim');an&&restartClass(an,'dance',1800);pa&&restartClass(pa,'dance',1800);
  bubble(S.x,headY(),'LA LA LA!','#8a6bd1');
  say(fromBird?'You play the bird\'s song! Far away, the bird sings with you. Tweet tweet!'
    :S.pal?'You play the song… and you and your friend dance! Cha cha cha!':'You play the song… and you dance! Cha cha cha!','');

    S.busy=false;react('happy');say(fromBird?'You and the bird make music! Poooourrr!':'What a dance! Poooourrr! Look, a new song.');
  },2000);
}

// every lesson is four questions: count, find a colour, find a shape, find a letter
const LESSON=['count','colour','shape','letter'];
const COLS=[['RED','#d8243c'],['BLUE','#2c8fd6'],['YELLOW','#ffd34d'],['GREEN','#1f8a4c'],['ORANGE','#f5891f'],['PINK','#f38db5'],['PURPLE','#8a6bd1']];

const ABC=[['C','CAT'],['F','FISH'],['M','MOON'],['S','SUN'],['B','BIRD'],['D','DUCK'],['H','HEART']];
const NOUN={fish:['fish','fish'],stars:['star','stars'],hearts:['heart','hearts'],pumpkins:['pumpkin','pumpkins'],bats:['bat','bats'],
  trees:['tree','trees'],presents:['present','presents'],eggs:['egg','eggs'],balloons:['balloon','balloons'],lanterns:['lantern','lanterns']};
const CARDX=[92,200,308];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function lesson(n){
  const t=LESSON[n%4],pool=t==='count'?[1,2,3,4,5]:[...Array((t==='colour'?COLS:t==='shape'?SHAPES:ABC).length).keys()];
  const things=['fish','stars',...(party().count||['hearts'])];
  return {t,opts:shuffle(pool).slice(0,3),ans:Math.floor(Math.random()*3),k:things[Math.floor(Math.random()*things.length)],c:shuffle([...KEYC.keys()]).slice(0,3)};
}
const qRight=()=>S.q.opts[S.q.ans];
function qHint(){
  const q=S.q,o=qRight();
  return q.t==='count'?`How many ${NOUN[q.k][1]}? Tap the number`
    :q.t==='colour'?`Find ${COLS[o][0]}!`
    :q.t==='shape'?`Find the ${SHAPES[o]}!`
    :`${ABC[o][1]} starts with ${ABC[o][0]}. Find ${ABC[o][0]}!`;
}
function qStory(){
  const q=S.q,o=qRight();
  return q.t==='count'?`Miss Owl draws some ${NOUN[q.k][1]}. How many?`

function shapeSVG(n,x,y,r,fill,line=INK,w=3){

const PLACES=['park','play','cafe','pool','rest','school'];
const PLACE={park:'park',play:'playground',cafe:'cat café',pool:'swimming pool',rest:'restaurant',school:'cat school'};
// where the cat comes back out on the square from each place; from the park it walks in from the right
const DOORX={cafe:51,rest:149,school:251,pool:349,play:350};
// each day the square shows you two places to go: places you have never been come first
function dayPicks(){
  const fresh=PLACES.filter(p=>!S.seen.includes(p)),turn=PLACES.map((_,i)=>PLACES[(i+(S.day-1)*2)%PLACES.length]);
  return [...new Set([...fresh,...turn])].slice(0,2);
}

function placeGoal(own,more){
  const p=nextPick();
  return S.fish==='carry'?{id:'go-square',hint:'Take your fish home ↖'}
    :night()?{id:'go-square',hint:'It is night! Go home ↖'}
    :own()||(p?{id:'go-square',hint:`Now the ${PLACE[p]}! Back to the square ↖`}

function walkTo(tx,cb){
  const dist=tx-S.x;
  if(Math.abs(dist)<4){cb&&cb();return}
  S.busy=true;S.face=dist<0?-1:1;
  const flip=$('#catFlip'),an=$('#catAnim'),cat=$('#cat');
  if(!cat){S.busy=false;cb&&cb();return}
  flip.setAttribute('transform',`scale(${S.face},1)`);an.classList.add('walk');
  const sx=S.x,dur=Math.abs(dist)/.22,t0=performance.now(),g=GEN;let px=sx;
  (function step(t){
    if(g!==GEN){an.classList.remove('walk');return}
    const p=Math.min(1,(t-t0)/dur);S.x=sx+dist*p;cat.setAttribute('transform',`translate(${S.x},${FLOOR})`);follow();
    // each paw on the piano plays the key under it; in the snow, paws leave prints
    if(S.scene==='piano'){const k=keyAt(S.x);if(k!==S.lastKey){S.lastKey=k;k>=0&&playKey(k)}}
    if(outside()&&snowy()&&Math.abs(S.x-px)>=18){px=S.x;addPrint()}
    if(p<1)requestAnimationFrame(step);else{an.classList.remove('walk');S.busy=false;cb&&cb()}
  })(t0);
}

function follow(){
  if(palRaf||!S.pal)return;
  const tick=()=>{
    const el=$('#pal'),fl=$('#palFlip'),an=$('#palAnim');
    if(!el){palRaf=0;return}
    const tx=Math.max(30,Math.min(370,S.x-62*S.face)),d=tx-S.palX;
    if(Math.abs(d)<1.5){
      palRaf=0;an.classList.remove('walk');S.palFace=S.x>=S.palX?1:-1;fl.setAttribute('transform',`scale(${S.palFace},1)`);return;
    }
    S.palX+=Math.sign(d)*Math.min(Math.abs(d)*.12+.4,4.2);S.palFace=Math.sign(d);
    el.setAttribute('transform',`translate(${S.palX.toFixed(1)},${FLOOR}) scale(.82)`);fl.setAttribute('transform',`scale(${S.palFace},1)`);an.classList.add('walk');
    palRaf=requestAnimationFrame(tick);
  };
  palRaf=requestAnimationFrame(tick);
}

/* ---------- sound ---------- */
let AC=null;
function ac(){
  if(!S.sound)return null;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}
  return AC;
}
function seq(type,notes){
  const a=ac();if(!a)return;let t=a.currentTime;
  notes.forEach(([f1,f2,d,v])=>{
    const o=a.createOscillator(),g=a.createGain();o.type=type;
    o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);t+=d+.07;
  });
}
const sfx={
  meow(scared){
    const a=ac();if(!a)return;const t=a.currentTime,d=scared?.8:.6,base=scared?650:480;
    const o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
    o.type='sawtooth';f.type='bandpass';f.frequency.value=scared?1400:1000;f.Q.value=2;
    o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.6,t+d*.35);o.frequency.linearRampToValueAtTime(base*.8,t+d);
    if(scared){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=14;lg.gain.value=45;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+d)}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(scared?.4:.28,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
  },
  purr(){
    const a=ac();if(!a)return;const t=a.currentTime,d=1.4,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
    const g=a.createGain();g.gain.value=.5;const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=24;lg.gain.value=.5;lfo.connect(lg).connect(g.gain);
    const env=a.createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(1.2,t+.2);env.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(env).connect(a.destination);s.start(t);lfo.start(t);s.stop(t+d);lfo.stop(t+d);
  },
  woof(){seq('square',[[260,140,.18,.15],[260,140,.18,.15]])},
  beep(){seq('square',[[520,520,.15,.08],[520,520,.15,.08]])},
  bzz(){seq('sawtooth',[[110,150,.9,.1]])},
  rumble(){seq('sine',[[80,50,.4,.5],[70,45,.5,.5]])},
  slurp(){seq('sine',[[300,700,.12,.15],[300,700,.12,.15]])},
  coin(){seq('triangle',[[660,660,.1,.14],[990,990,.22,.14]])},
  pounce(){seq('sine',[[220,620,.14,.2]])},
  boing(){seq('sine',[[200,520,.15,.2],[520,300,.2,.15]])},
  scrape(){seq('sawtooth',[[95,75,.28,.05]])},
  crash(){
    const a=ac();if(!a)return;const t=a.currentTime,d=.7,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1200;
    const g=a.createGain();g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
    seq('triangle',[[2100,2100,.05,.08],[2700,2700,.05,.06],[1900,1900,.07,.05]]);
  },
  sticker(){seq('triangle',[[523,523,.1,.12],[659,659,.1,.12],[784,784,.22,.12]])},
  stick(){seq('sine',[[300,900,.08,.22]])},
  twinkle(n){const f=[523,587,659,784,880][Math.min(n,5)-1];seq('triangle',[[f,f,.12,.12],[f*2,f*2,.2,.08]])},
  note(i){
    const a=ac();if(!a)return;const t=a.currentTime,f=NOTE[i];
    [[f,'triangle',.28],[f*2,'sine',.06]].forEach(([fr,ty,v])=>{
      const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=fr;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.7);
      o.connect(g).connect(a.destination);o.start(t);o.stop(t+.75);
    });
  },
  chord(){[0,2,4,7].forEach(i=>this.note(i))},
  crunch(soft){
    const a=ac();if(!a)return;const t=a.currentTime,len=Math.floor(a.sampleRate*.5);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);
    // three little crackly bursts
    for(let i=0;i<len;i++){const k=(i/len*3)%1;ch[i]=(Math.random()*2-1)*Math.max(0,1-k*2.2)}
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=soft?700:2200;f.Q.value=.8;
    const g=a.createGain();g.gain.value=soft?.5:.35;s.connect(f).connect(g).connect(a.destination);s.start(t);
  },
  achoo(){
    seq('sine',[[500,820,.32,.12]]);
    const a=ac();if(!a)return;const t=a.currentTime+.42,d=.35,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1500;
    const g=a.createGain();g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
  },
  noise(d,type,fr,v){
    const a=ac();if(!a)return;const t=a.currentTime,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=fr;
    const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
  },
  pop(){seq('sine',[[600,1400,.07,.22]])},
  squeak(){seq('square',[[1300,1700,.09,.05],[1400,1800,.09,.05]])},
  quack(){seq('sawtooth',[[420,300,.12,.12],[400,270,.15,.12]])},
  chatter(){seq('square',[[1200,900,.04,.05],[1200,900,.04,.05],[1200,900,.04,.05]])},
  chirp(i){const f=NOTE[i]*2;seq('triangle',[[f*1.15,f,.07,.12],[f,f*1.05,.2,.1]])},
  whoosh(){this.noise(.6,'lowpass',900,.5)},
  shake(){this.noise(.9,'bandpass',500,.45)},
  roll(){seq('sine',[[180,120,.3,.15]])},
  plop(){seq('sine',[[500,180,.12,.18]])},
  boo(){seq('triangle',[[260,340,.3,.16],[340,170,.6,.16]])},
  jingle(){seq('triangle',[[1320,1320,.1,.1],[1320,1320,.1,.1],[1320,1320,.22,.1],[1568,1568,.1,.1],[1047,1047,.1,.1],[1175,1175,.1,.1],[1320,1320,.3,.1]])},
  toot(){seq('sawtooth',[[300,600,.25,.09],[600,450,.3,.09]])},
  gong(){seq('sine',[[150,140,1.4,.3]]);seq('triangle',[[300,296,1,.06]])},
  hoo(){seq('sine',[[440,400,.22,.22],[420,370,.4,.2]])},
  whee(){seq('sine',[[420,980,.45,.16]])},
  nope(){seq('sine',[[330,250,.16,.14]])},
  pipes(){
    // a drone underneath and a little tune on top, like bagpipes
    const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=110;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.1);g.gain.setValueAtTime(.04,t+1.7);g.gain.exponentialRampToValueAtTime(.0001,t+2);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+2.05);
    seq('square',[[440,440,.2,.04],[494,494,.2,.04],[554,554,.3,.04],[494,494,.2,.04],[440,440,.25,.04],[659,659,.4,.04]]);
  },
  chug(){this.noise(.09,'lowpass',500,.3);setTimeout(()=>this.noise(.09,'lowpass',380,.22),190)},
  boom(){seq('sine',[[120,40,.7,.4]]);this.noise(.8,'lowpass',300,.6)},
  ding(){seq('triangle',[[1320,1320,.35,.12]])},
  whistle(){seq('square',[[2100,2300,.1,.04],[2100,2300,.3,.04]])},
  psh(){this.noise(.8,'highpass',2500,.3)},
  coo(){seq('sine',[[400,330,.18,.16],[380,300,.25,.14]])},
  splash(){
    const a=ac();if(!a)return;const t=a.currentTime,d=.45,len=Math.floor(a.sampleRate*d);
    const b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(400,t+d);
    const g=a.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d);
  }
};

const partyIcon=(t,w=34)=>`<svg width="${w}" height="${w}" viewBox="-28 -32 56 56" aria-hidden="true">${PARTY[t].icon()}</svg>`;
const partyRow=()=>`<p>PARTY: <span class="partyName">${party().name.toUpperCase()}</span></p>
    <div class="parties">${PARTIES.map(t=>`<button data-a="party" data-t="${t}" aria-pressed="${t===THEME}" aria-label="${PARTY[t].name}">${partyIcon(t,32)}</button>`).join('')}</div>`;
function showParties(){
  openOv('parties',`<h2>Pick a party!</h2>
    ${PARTIES.map(t=>`<button class="big party" data-a="party" data-t="${t}" aria-pressed="${t===THEME}">${partyIcon(t,40)} ${PARTY[t].name.toUpperCase()}</button>`).join('')}
    <button class="big small" data-a="menu" data-focus>← BACK</button>`,
    'Which party is it today?','Tap a party to dress up the game');
}
let ovKind='';
function openOv(kind,html,story,hint){
  ovKind=kind;ov.innerHTML=html;ov.hidden=false;ov.scrollTop=0;
  document.getElementById('story').textContent=story;document.getElementById('hint').textContent=hint||'';
  const f=ov.querySelector('[data-focus]');f&&f.focus({preventScroll:true});
}
function closeOv(){ov.hidden=true;ov.innerHTML='';ovKind=''}
function showTitle(){
  if(!DB.cats.length){showName();return}
  const cats=[...DB.cats].sort((a,b)=>(b.at||0)-(a.at||0));
  openOv('title',`<h2>Who is playing?</h2>
    ${partyRow()}
    <div class="row">${DB.cats.length<MAXCATS?`<button class="big small green" data-a="new">+ NEW CAT</button>`:''}<button class="big small gold" data-a="board">${TROPHY} TOP CATS</button></div>
    <div class="cats">${cats.map(c=>`<div class="card"><button class="big pick${c.id===CUR?' pink':''}" data-a="play" data-id="${esc(c.id)}">${miniCat(c.s)}<span><span class="nm">${esc(c.name)}</span><span class="meta">${metaOf(c)}</span></span></button>
      <button class="x" data-a="del" data-id="${esc(c.id)}" aria-label="Say bye-bye to ${esc(c.name)}">×</button></div>`).join('')}</div>
`,
    'Who is playing today?','Tap your cat to keep playing');
}
function showName(){
  const pick=NAMES.filter(n=>!DB.cats.some(c=>c.name===n));
  const first=pick[0]||NAMES[0];
  openOv('name',`<h2>Your cat's name?</h2>
    <svg viewBox="-60 -196 120 202" width="60" height="96" style="align-self:center" aria-hidden="true">${catSVG('happy')}</svg>
    <input id="nameIn" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Cat name" value="${first}">
    <button class="big pink" data-a="go" data-focus>GO! ▶</button>
    <div class="sugg">${(pick.length?pick:NAMES).slice(0,6).map(n=>`<button data-a="sugg" data-n="${n}">${n}</button>`).join('')}</div>
    ${partyRow()}
    ${DB.cats.length?`<button class="big small" data-a="title">← BACK</button>`:''}`,
    'You are a cat! What is your name?','Tap a name, or type one. Then tap GO!');
}
function showMenu(){
  const c=curCat();if(!c){showTitle();return}
  save();if(ov.hidden)PREV=[document.getElementById('story').textContent,document.getElementById('hint').textContent];
  openOv('menu',`<div class="menuTop">${miniCat(S,'happy')}<div><h2>${esc(c.name)}</h2><p>DAY ${S.day} · ★ ${S.points}</p></div>
      <button class="snd" data-a="snd" aria-pressed="${S.sound}">${S.sound?'♪ ON':'♪ OFF'}</button></div>
    <button class="big pink" data-a="close" data-focus>▶ KEEP PLAYING</button>
    <button class="big blue" data-a="save" id="saveBtn">✓ SAVE</button>
    <button class="big green" data-a="again">↺ START AGAIN</button>
    <button class="big gold" data-a="board">${TROPHY} TOP CATS</button>
    ${canMove()?`<button class="big blue" data-a="move">${houseIcon} MOVE HOUSE</button>`:''}
    <button class="big orange" data-a="parties">${partyIcon(THEME,30)} PARTY: ${party().name.toUpperCase()}</button>
    <button class="big" data-a="title">CHANGE CAT</button>`,
    'Paws! The game is waiting for you.','');
}
function showBoard(){
  const cats=[...DB.cats].sort((a,b)=>score(b)-score(a));
  const MED=['#ffd34d','#d3d4dc','#e09a78'];
  openOv('board',`<h2>${TROPHY} Top cats</h2>
    <div class="board">${cats.map((c,i)=>`<div class="rank${c.id===CUR?' me':''}"><span class="medal" style="${i<3?`background:${MED[i]}`:''}">${i+1}</span>
      ${miniCat(c.s)}<span class="nm">${esc(c.name)}<span class="meta">DAY ${c.s&&c.s.day||1}</span></span><span class="score"><span class="star">★</span> ${score(c)}</span></div>`).join('')}</div>
    <button class="big pink" data-a="${ovKind==='menu'?'menu':'title'}" data-focus>← BACK</button>`,
    cats.length?`${cats[0].name} is the top cat!`:'No cats yet!','Points come from hearts, fun things and naps');
}
function confirmBox(q,sub,yes,no){
  openOv('confirm',`${miniCat(null,'scared').replace('class="mini"','class="mini" style="align-self:center"')}
    <h2>${esc(q)}</h2><p>${esc(sub)}</p>
    <button class="big pink" data-a="no" data-focus>NO, KEEP IT!</button>
    <button class="big small" data-a="yes">YES</button>`,q,'');
  CONFIRM={yes,no};
}
let CONFIRM=null, PREV=null;
// back to the game: the story and hint come back as they were
function resume(){closeOv();if(PREV){document.getElementById('story').textContent=PREV[0];document.getElementById('hint').textContent=PREV[1]}refreshGoal()}
// a fresh start for this cat or a different cat: stop whatever the last one was doing
function reset(){GEN++;clearLater();clearBubbles();S.busy=false;stage.classList.remove('fade')}
function startCat(c){
  reset();CUR=c.id;loadState(c.s);closeOv();
  const w=document.getElementById('who'),mb=document.getElementById('menuBtn');w.textContent=c.name;mb.hidden=false;mb.setAttribute('aria-label',`Menu for ${c.name}`);
  if(!S.awake){render();updateHud();say(c.s?`Welcome back, ${c.name}! You are asleep.`:`You are a cat called ${c.name}. You are asleep.`)}
  else{render();updateHud();go(S.scene,200);later(()=>{const s=document.getElementById('story');s.textContent=`Welcome back, ${c.name}! `+s.textContent},360)}
}
function newCat(name){
  const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,best:0,at:Date.now(),s:null};
  DB.cats.push(c);startCat(c);
}
function startAgain(){
  const c=curCat();if(!c)return;
  c.best=Math.max(c.best||0,S.points);reset();loadState(null);closeOv();render();updateHud();
  say(`A brand new start, ${c.name}! Day 1. You are asleep.`);
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  ac();const a=b.dataset.a,id=b.dataset.id;
  if(a==='play'){const c=DB.cats.find(c=>c.id===id);c&&startCat(c)}
  else if(a==='new') showName();
  else if(a==='title') showTitle();
  else if(a==='board') showBoard();
  else if(a==='menu') showMenu();
  else if(a==='close') resume();
  else if(a==='sugg'){const i=document.getElementById('nameIn');i.value=b.dataset.n;sfx.twinkle(2)}
  else if(a==='go'){
    const v=(document.getElementById('nameIn').value||'').trim().toUpperCase().replace(/\s+/g,' ').slice(0,10);
    sfx.sticker();newCat(v||NAMES[0]);
  }
  else if(a==='snd'){S.sound=!S.sound;b.textContent=S.sound?'♪ ON':'♪ OFF';b.setAttribute('aria-pressed',S.sound);try{localStorage.setItem(SAVE+'-sound',S.sound?'1':'0')}catch(e){}}
  else if(a==='parties') showParties();
  else if(a==='party'){
    // a new party redraws the scene behind, so the hint on return matches it
    const t=b.dataset.t;setTheme(t);t==='none'?sfx.twinkle(2):party().sound();
    if(!S.busy){render();if(PREV)PREV[1]=SC[S.scene].goal().hint}
    if(ovKind==='parties'){resume();if(t!=='none'&&!S.busy)say(`${party().hi} Look around for party things!`)}
    else{ov.querySelectorAll('[data-a="party"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===t));ov.querySelector('.partyName').textContent=party().name.toUpperCase()}
  }
  else if(a==='move') offerMove();
  else if(a==='trip') startTrip(b.dataset.t);
  else if(a==='moveyes') moveHouse();
  else if(a==='moveno'){S.moveAsk=S.day;save();resume()}
  else if(a==='save'){save();sfx.coin();b.innerHTML='✓ SAVED!';restartClass(b,'bump',500)}
  else if(a==='again') confirmBox('Start again from day 1?','Your hearts, points and stickers start over.',startAgain,showMenu);
  else if(a==='del'){const c=DB.cats.find(c=>c.id===id);c&&confirmBox(`Say bye-bye to ${c.name}?`,'This cat goes away for good.',()=>{
    DB.cats=DB.cats.filter(x=>x.id!==id);store();
    if(CUR===id){CUR=null;reset();document.getElementById('menuBtn').hidden=true;loadState(null);render();updateHud()}
    showTitle()},showTitle)}
  else if(a==='yes'){const f=CONFIRM&&CONFIRM.yes;CONFIRM=null;f&&f()}
  else if(a==='no'){const f=CONFIRM&&CONFIRM.no;CONFIRM=null;f&&f()}
});
ov.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nameIn'){e.preventDefault();ov.querySelector('[data-a="go"]').click()}});
document.getElementById('menuBtn').addEventListener('click',()=>{ac();ov.hidden?showMenu():CUR?resume():0});
// saving when the page goes away too, in case the last tap did not tell a story
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>document.visibilityState==='hidden'&&save());

render();updateHud();showTitle();
</script>
